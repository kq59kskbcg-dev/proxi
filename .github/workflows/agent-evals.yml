name: Agent evals

# Runs when a pull request changes the agent, the MCP server or the chat route. Make this a
# required check in the branch protection rules so a failing change can't be merged.
on:
  pull_request:
    paths:
      - 'packages/agent/**'
      - 'apps/mcp/**'
      - 'apps/web/api/chat.js'
      - 'package-lock.json'
      - '.github/workflows/agent-evals.yml'

permissions:
  contents: read

jobs:
  evals:
    # Secrets are not available to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Evals
        run: npm run eval:ci -w @proxi/agent
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
