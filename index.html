<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F8}
a{color:#3550C8}a:hover{color:#22389A}
button{font-family:inherit}
textarea,input{font-family:inherit}
input::placeholder,textarea::placeholder{color:#6B6B74}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.composer:focus-within{border-color:var(--accent) !important;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent) !important}
.hov:hover{background:rgba(24,24,27,0.06) !important}
.chip:hover{background:#F7F7F8 !important;border-color:#C4C4CC !important}
.menu-item:hover{background:#F1F1F4 !important}
.umsg .uact{opacity:0}
.umsg:hover .uact,.umsg:focus-within .uact{opacity:1}
@keyframes pulse{0%,80%,100%{opacity:0.35;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}
.dot{animation:pulse 1.2s infinite ease-in-out}
.dot:nth-child(2){animation-delay:0.15s}
.dot:nth-child(3){animation-delay:0.3s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{animation:rise 0.16s ease-out}
@media (prefers-reduced-motion: reduce){.dot,.pop{animation:none}}
.scrim{display:none}
@media (max-width: 830px){
.side{display:flex !important;position:fixed;top:0;left:0;bottom:0;width:280px;z-index:40;transform:translateX(-100%);visibility:hidden;transition:transform 0.3s cubic-bezier(0.32,0.72,0,1),visibility 0.3s,box-shadow 0.3s}
.side.open{transform:none;visibility:visible;box-shadow:8px 0 24px rgba(24,24,27,0.16)}
.scrim{display:block;position:fixed;top:0;right:0;bottom:0;left:280px;z-index:39;border:0;padding:0;margin:0;background:rgba(24,24,27,0.25);cursor:default;opacity:0;pointer-events:none;transition:opacity 0.25s ease}
.scrim.on{opacity:1;pointer-events:auto}
.menu-btn{display:flex !important}
}
@media (prefers-reduced-motion: reduce){.side,.scrim{transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="tpl">
<div :style="`--accent: ${v.accent}; position: relative; height: 100vh; min-height: 560px; overflow: hidden; display: flex; background: #F7F7F8; font-family: Inter, system-ui, sans-serif; color: #18181B; font-size: 15px`">

  <template v-if="v.anyMenu">
    <button aria-label="Close menu" tabindex="-1" @click="v.closeMenus" style="position: absolute; inset: 0; z-index: 30; border: 0; padding: 0; margin: 0; background: transparent; cursor: default"></button>
  </template>
  <button aria-label="Close sidebar" tabindex="-1" :class="v.narrowNav ? 'scrim on' : 'scrim'" @click="v.collapse"></button>

  <template v-if="v.showNav">
  <nav :class="v.navClass" aria-label="Conversations" style="flex: 0 0 280px; max-height: 100%; overflow-y: auto; box-sizing: border-box; background: #EFEFF1; border-right: 1px solid #E2E2E6; padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div :style="`width: 28px; height: 28px; border-radius: 8px; background: ${v.accent}; display: flex; align-items: center; justify-content: center`">
          <span aria-hidden="true" style="color: #FFFFFF; font-weight: 700; font-size: 15px; line-height: 1">P</span>
        </div>
        <span style="font-weight: 600; font-size: 16px">Proxi</span>
      </div>
      <button class="hov" aria-label="Collapse sidebar" @click="v.collapse" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: #52525B; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <button :class="v.nav.newCls" :aria-current="v.nav.newCur" @click="v.newChat" :style="`height: 44px; border: 0; background: ${v.nav.newBg}; box-shadow: ${v.nav.newShadow}; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: #18181B; cursor: pointer`">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        New chat
      </button>
      <button :class="v.nav.knowledgeCls" :aria-current="v.nav.knowledgeCur" @click="v.openKnowledge" :style="`height: 44px; border: 0; background: ${v.nav.knowledgeBg}; box-shadow: ${v.nav.knowledgeShadow}; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: #18181B; cursor: pointer`">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg>
        Knowledge
      </button>
      <button :class="v.nav.skillsCls" :aria-current="v.nav.skillsCur" @click="v.openSkills" :style="`height: 44px; border: 0; background: ${v.nav.skillsBg}; box-shadow: ${v.nav.skillsShadow}; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: #18181B; cursor: pointer`">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
        Skills
      </button>
      <button :class="v.nav.behaviorCls" :aria-current="v.nav.behaviorCur" @click="v.openBehavior" :style="`height: 44px; border: 0; background: ${v.nav.behaviorBg}; box-shadow: ${v.nav.behaviorShadow}; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: #18181B; cursor: pointer`">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
        Behavior
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 2px 10px">
        <span style="font-size: 12px; font-weight: 600; color: #5C5C66; letter-spacing: 0.02em">Recents</span>
        <button class="hov" aria-label="Search chats" :aria-expanded="v.searchExpanded" @click="v.toggleSearch" style="width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; color: #52525B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
      </div>
      <template v-if="v.searchOpen">
  <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.06)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <label for="chat-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search chats</label>
          <input id="chat-search" :ref="v.searchRef" type="search" placeholder="Search chats" :value="v.query" @input="v.onQuery" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 14px; color: #18181B; outline: none">
          <button class="hov" aria-label="Close search" @click="v.closeSearch" style="width: 36px; height: 36px; border: 0; background: transparent; border-radius: 8px; color: #52525B; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </template>
      <template v-if="v.hasToday">
        <template v-for="(c, i_c) in v.today" :key="i_c">
          <button :class="c.cls" :aria-current="c.current" @click="c.open" :style="`border: 0; text-align: left; cursor: pointer; color: ${c.color}; background: ${c.bg}; box-shadow: ${c.shadow}; border-radius: 8px; padding: 10px 10px; font-size: 14px; font-weight: ${c.weight}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis`">{{ c.title }}</button>
        </template>
      </template>
      <template v-if="v.hasOlder">
        <div style="font-size: 12px; font-weight: 600; color: #5C5C66; padding: 16px 10px 6px; letter-spacing: 0.02em">Previous 7 days</div>
        <template v-for="(c, i_c) in v.older" :key="i_c">
          <button :class="c.cls" :aria-current="c.current" @click="c.open" :style="`border: 0; text-align: left; cursor: pointer; color: ${c.color}; background: ${c.bg}; box-shadow: ${c.shadow}; border-radius: 8px; padding: 10px 10px; font-size: 14px; font-weight: ${c.weight}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis`">{{ c.title }}</button>
        </template>
      </template>
      <template v-if="v.noResults">
        <p style="margin: 0; padding: 10px; font-size: 14px; color: #52525B">No chats match "{{ v.query }}".</p>
      </template>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 10px 0; border-top: 1px solid #E2E2E6">
      <div style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #D4D4DA; display: flex; align-items: center; justify-content: center; color: #3F3F46"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></div>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-size: 14px; font-weight: 500">Alex Morgan</span>
        <span style="font-size: 12px; color: #5C5C66">Pro plan</span>
      </div>
      <button class="hov" aria-label="Settings" @click="v.openSettings" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: #52525B; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </button>
    </div>
  </nav>
  </template>

  <main style="flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #FFFFFF">
    <header :style="`flex: none; height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 20px; border-bottom: 1px solid ${v.headerBorder}`">
      <div style="display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1 1 auto">
        <button class="menu-btn hov" aria-label="Open sidebar" @click="v.openNav" :style="`display: ${v.menuBtnDisplay}; flex: none; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: #3F3F46; align-items: center; justify-content: center; cursor: pointer`">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
        </button>
        <template v-if="v.isChat">
          <div style="position: relative; min-width: 0">
            <button class="hov" :aria-label="`${v.chatTitle}, chat options`" :aria-expanded="v.chatMenuExpanded" @click="v.toggleChatMenu" style="max-width: 100%; height: 40px; border: 0; background: transparent; border-radius: 10px; padding: 0 10px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #18181B; cursor: pointer">
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ v.chatTitle }}</span>
              <svg style="flex: none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
            </button>
            <template v-if="v.chatMenu">
              <div class="pop" role="menu" style="position: absolute; top: 46px; left: 0; z-index: 31; min-width: 200px; background: #FFFFFF; border: 1px solid #E2E2E6; border-radius: 12px; box-shadow: 0 8px 24px rgba(24,24,27,0.12); padding: 6px">
                <button class="menu-item" role="menuitem" @click="v.deleteChat" style="width: 100%; height: 40px; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: #B42318; cursor: pointer">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
                  Delete chat
                </button>
              </div>
            </template>
          </div>
        </template>
        <template v-if="v.isPage">
          <h1 style="margin: 0; padding: 0 10px; font-size: 15px; font-weight: 600">{{ v.page.title }}</h1>
        </template>
      </div>
      <template v-if="v.isChat">
        <button class="hov" @click="v.share" style="flex: none; height: 40px; border: 1px solid #E2E2E6; background: #FFFFFF; border-radius: 10px; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #18181B; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
          Share
        </button>
      </template>
    </header>

    <template v-if="v.isChat">
    <section aria-label="Messages" :ref="v.msgRef" style="flex: 1; min-height: 0; overflow-y: auto; padding: 32px 24px 24px">
      <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
        <template v-for="(m, i_m) in v.msgs" :key="i_m">
          <template v-if="m.isUser">
            <div class="umsg" style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
              <div style="max-width: 80%; background: #F1F1F4; border-radius: 18px 18px 6px 18px; padding: 12px 16px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere">{{ m.text }}</div>
              <div class="uact" style="display: flex; gap: 2px">
                <button class="hov" aria-label="Edit message" @click="m.onEdit" style="width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; color: #63636B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
                <button class="hov" :aria-label="m.copyLabel" @click="m.onCopy" style="width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; color: #63636B; display: flex; align-items: center; justify-content: center; cursor: pointer">
                  <template v-if="m.copied"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></template>
                  <template v-if="m.notCopied"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></template>
                </button>
              </div>
            </div>
          </template>
          <template v-if="m.isAssistant">
            <article style="display: flex; gap: 14px">
              <div :style="`flex: none; width: 30px; height: 30px; border-radius: 8px; background: ${v.accent}; display: flex; align-items: center; justify-content: center`">
                <span aria-hidden="true" style="color: #FFFFFF; font-weight: 700; font-size: 15px; line-height: 1">P</span>
              </div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; line-height: 1.65">
                <template v-if="m.isPlain">
                  <p style="margin: 0; white-space: pre-line">{{ m.text }}</p>
                </template>
                <template v-if="m.isRich">
                  <p style="margin: 0">Here is a typed version. It uses generics so the returned function accepts exactly the same parameters as the original.</p>
                  <div style="border: 1px solid #E2E2E6; border-radius: 12px; overflow: hidden">
                    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px; background: #F7F7F8; border-bottom: 1px solid #E2E2E6">
                      <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #52525B"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; color: #27272A">debounce.ts</span><span>TypeScript</span></span>
                      <span style="display: flex; gap: 2px">
                        <button class="hov" aria-label="Wrap long lines" :aria-pressed="v.wrapPressed" @click="v.toggleWrap" :style="`width: 32px; height: 32px; border: 0; background: ${v.wrapBg}; border-radius: 8px; color: #52525B; display: flex; align-items: center; justify-content: center; cursor: pointer`">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h15a3 3 0 0 1 0 6h-4"></path><path d="M16 16l-2 2 2 2"></path><path d="M3 18h7"></path></svg>
                        </button>
                        <button class="hov" @click="v.copyCode" style="height: 32px; border: 0; background: transparent; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #52525B; cursor: pointer">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
                          {{ v.codeCopyLabel }}
                        </button>
                      </span>
                    </div>
                    <pre :style="`margin: 0; padding: 16px; overflow-x: auto; white-space: ${v.preWS}; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.7; color: #27272A; background: #FBFBFC`"><span style="color: #8A3FC0">export function</span> <span style="color: #2F5BD3">debounce</span>&lt;T <span style="color: #8A3FC0">extends</span> (...args: <span style="color: #A0522D">any</span>[]) =&gt; <span style="color: #A0522D">void</span>&gt;(
  fn: T,
  wait = <span style="color: #B4540A">200</span>
): (...args: Parameters&lt;T&gt;) =&gt; <span style="color: #A0522D">void</span> {
  <span style="color: #8A3FC0">let</span> timer: ReturnType&lt;<span style="color: #8A3FC0">typeof</span> setTimeout&gt; | <span style="color: #A0522D">undefined</span>;
  <span style="color: #8A3FC0">return</span> (...args) =&gt; {
    clearTimeout(timer);
    timer = setTimeout(() =&gt; fn(...args), wait);
  };
}</pre>
                  </div>
                  <p style="margin: 0">A few notes:</p>
                  <ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px">
                    <li><code style="font-family: 'JetBrains Mono', monospace; font-size: 13px; background: #F1F1F4; padding: 2px 6px; border-radius: 5px">Parameters&lt;T&gt;</code> carries the original argument types through.</li>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script>
// Minimal stand-in for the Design canvas runtime: a React-style class
// component (state, setState, lifecycle) rendered through Vue.
const { createApp, ref, computed, onMounted, onUpdated, onBeforeUnmount } = Vue;

class DCLogic {
  constructor(props) { this.props = props; }
  setState(update) {
    const patch = typeof update === 'function' ? update(this.state) : update;
    if (!patch) return;
    this.state = { ...this.state, ...patch };
    this.tick.value++;
  }
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const start = props.startView === 'new' ? 'new' : 'chat';
    this.nextId = 100;
    this.timers = [];
    this.sig = '';
    this.state = {
      convs: this.seed(),
      activeId: start === 'chat' ? 'debounce' : null,
      view: start,
      draft: '',
      typing: start === 'chat',
      typingConv: start === 'chat' ? 'debounce' : null,
      model: 'Opus 5.5',
      modelMenu: false,
      chatMenu: false,
      searchOpen: false,
      query: '',
      collapsed: false,
      narrowNav: false,
      wrap: false,
      copied: null,
      toast: '',
      votes: {}
    };
  }

  seed() {
    const u = (id, text) => ({ id, role: 'user', text });
    const a = (id, text) => ({ id, role: 'assistant', text });
    return [
      { id: 'debounce', title: 'Debounce helper in TypeScript', group: 'Today', messages: [
        u(1, 'Can you write a small debounce helper in TypeScript? It should keep the argument types of the wrapped function.'),
        { id: 2, role: 'assistant', rich: 'debounce' },
        u(3, 'Yes, add a cancel method please.')
      ] },
      { id: 'lisbon', title: 'Trip plan for Lisbon', group: 'Today', messages: [
        u(4, 'Plan a 3 day trip to Lisbon for someone who likes food and walking.'),
        a(5, 'Here is a relaxed plan built around neighborhoods, so most days stay walkable.\n\nDay 1: Alfama and Baixa. Castle views, then grilled sardines for lunch.\nDay 2: Belém. Riverside walk and the famous custard tarts.\nDay 3: Príncipe Real. Markets, gardens and a long dinner.')
      ] },
      { id: 'email', title: 'Rewrite onboarding email', group: 'Today', messages: [
        u(6, 'Can you make our onboarding email shorter and warmer?'),
        a(7, 'Here is a tighter version:\n\nSubject: Welcome aboard\n\nHi [Name], we are glad you are here. Your account is ready, and the quick-start guide will have you set up in about five minutes. Reply to this email if anything gets in the way.')
      ] },
      { id: 'sql', title: 'SQL window functions', group: 'Previous 7 days', messages: [
        u(8, 'When should I use a window function instead of GROUP BY?'),
        a(9, 'Use GROUP BY when you want one row per group. Use a window function when you want to keep every row and add a value computed across related rows, such as a running total or a rank within each group.')
      ] },
      { id: 'review', title: 'Quarterly review outline', group: 'Previous 7 days', messages: [
        u(10, 'Give me an outline for a quarterly review.'),
        a(11, '1. Goals and results\n2. What went well\n3. What did not, and why\n4. Priorities for next quarter\n5. Risks and asks')
      ] },
      { id: 'embed', title: 'Explain vector embeddings', group: 'Previous 7 days', messages: [
        u(12, 'Explain vector embeddings simply.'),
        a(13, 'An embedding turns text into a list of numbers so that similar meanings end up close together. That lets software find related content by measuring distance instead of matching exact words.')
      ] },
      { id: 'bread', title: 'Sourdough schedule', group: 'Previous 7 days', messages: [
        u(14, 'Plan a sourdough schedule around a 9 to 5 job.'),
        a(15, 'Feed the starter before work, mix the dough at 6 pm, stretch and fold through the evening, then shape and refrigerate overnight. Bake the next morning or after work.')
      ] }
    ];
  }

  code() {
    return 'export function debounce<T extends (...args: any[]) => void>(\n  fn: T,\n  wait = 200\n): (...args: Parameters<T>) => void {\n  let timer: ReturnType<typeof setTimeout> | undefined;\n  return (...args) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), wait);\n  };\n}';
  }

  componentDidMount() {
    if (this.state.typing) {
      this.replyTimer = this.later(() => this.addReply('debounce', 'Done. The returned function now has a cancel() method that clears any pending call, so nothing fires after you cancel it.'), 1800);
    }
  }

  componentWillUnmount() {
    this.timers.forEach((t) => clearTimeout(t));
  }

  componentDidUpdate() {
    const conv = this.state.convs.find((c) => c.id === this.state.activeId);
    const sig = this.state.view + ':' + this.state.activeId + ':' + (conv ? conv.messages.length : 0) + ':' + this.state.typing;
    if (sig !== this.sig) {
      this.sig = sig;
      if (this.msgEl) this.msgEl.scrollTop = this.msgEl.scrollHeight;
    }
  }

  later(fn, ms) {
    const t = setTimeout(() => {
      this.timers = this.timers.filter((x) => x !== t);
      fn();
    }, ms);
    this.timers.push(t);
    return t;
  }

  isNarrow() {
    try { return window.matchMedia('(max-width: 830px)').matches; } catch (e) { return false; }
  }

  focusComposer() {
    setTimeout(() => { if (this.taEl) this.taEl.focus(); }, 0);
  }

  showToast(text) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: text });
    this.toastTimer = this.later(() => this.setState({ toast: '' }), 2200);
  }

  addReply(convId, text) {
    const id = this.nextId++;
    this.replyTimer = null;
    this.setState((s) => ({
      typing: false,
      typingConv: null,
      convs: s.convs.map((c) => c.id === convId ? { ...c, messages: [...c.messages, { id, role: 'assistant', text }] } : c)
    }));
  }

  startReply(convId, text) {
    this.setState({ typing: true, typingConv: convId });
    this.replyTimer = this.later(() => this.addReply(convId, text), 1400);
  }

  send(raw) {
    const text = (raw != null ? raw : this.state.draft).trim();
    if (!text || this.state.typing) return;
    const id = this.nextId++;
    let convId = this.state.view === 'chat' ? this.state.activeId : null;
    let fresh = null;
    if (!convId) {
      convId = 'c' + id;
      fresh = { id: convId, title: text.length > 40 ? text.slice(0, 40).trim() + '...' : text, group: 'Today', messages: [] };
    }
    this.setState((s) => {
      const base = fresh ? [fresh, ...s.convs] : s.convs;
      return {
        draft: '',
        view: 'chat',
        activeId: convId,
        modelMenu: false,
        convs: base.map((c) => c.id === convId ? { ...c, messages: [...c.messages, { id, role: 'user', text }] } : c)
      };
    });
    const short = text.length > 60 ? text.slice(0, 60).trim() + '...' : text;
    this.startReply(convId, 'This is a prototype, so this reply is a placeholder. In the real app, Proxi would answer "' + short + '" here.');
  }

  stop() {
    if (this.replyTimer) { clearTimeout(this.replyTimer); this.timers = this.timers.filter((x) => x !== this.replyTimer); this.replyTimer = null; }
    this.setState({ typing: false, typingConv: null });
  }

  truncateAt(msgId) {
    this.setState((s) => ({
      convs: s.convs.map((c) => {
        if (c.id !== s.activeId) return c;
        const i = c.messages.findIndex((m) => m.id === msgId);
        return i < 0 ? c : { ...c, messages: c.messages.slice(0, i) };
      })
    }));
  }

  edit(msg) {
    this.stop();
    this.truncateAt(msg.id);
    this.setState({ draft: msg.text });
    this.focusComposer();
  }

  regen(msg) {
    if (this.state.typing) return;
    this.truncateAt(msg.id);
    this.startReply(this.state.activeId, 'Here is another take. In the real app, Proxi would write a fresh answer here.');
  }

  copy(key, text) {
    try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {}); } catch (e) {}
    this.setState({ copied: key });
    this.later(() => this.setState((s) => (s.copied === key ? { copied: null } : null)), 1500);
  }

  vote(id, dir) {
    this.setState((s) => ({ votes: { ...s.votes, [id]: s.votes[id] === dir ? null : dir } }));
  }

  go(patch) {
    this.setState({ chatMenu: false, modelMenu: false, narrowNav: false, ...patch });
  }

  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#3550C8';
    const conv = s.convs.find((c) => c.id === s.activeId);
    const isChat = s.view === 'chat' && !!conv;
    const isNew = s.view === 'new' || (s.view === 'chat' && !conv);
    const pages = {
      knowledge: { title: 'Knowledge', desc: 'Files and notes Proxi can draw on in every chat.', empty: 'No knowledge added yet', hint: 'Add documents, links or notes and Proxi will use them as context when they are relevant.', action: 'Add files' },
      skills: { title: 'Skills', desc: 'Reusable instructions Proxi can apply when a task calls for them.', empty: 'No skills yet', hint: 'Create a skill for a task you repeat, like a weekly report format or a code review checklist.', action: 'Create a skill' },
      behavior: { title: 'Behavior', desc: 'Set how Proxi responds: tone, length and format.', empty: 'Using default behavior', hint: 'Write custom instructions to change how Proxi answers in every new chat.', action: 'Write instructions' }
    };
    const page = pages[s.view] || pages.knowledge;
    const isPage = !!pages[s.view];

    const q = s.query.trim().toLowerCase();
    const item = (c) => {
      const on = isChat && c.id === s.activeId;
      return {
        title: c.title,
        cls: on ? '' : 'hov',
        current: on ? 'page' : 'false',
        bg: on ? '#FFFFFF' : 'transparent',
        shadow: on ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
        color: on ? '#18181B' : '#3F3F46',
        weight: on ? '500' : '400',
        open: () => this.go({ view: 'chat', activeId: c.id })
      };
    };
    const list = s.convs.filter((c) => !q || c.title.toLowerCase().includes(q));
    const today = list.filter((c) => c.group === 'Today').map(item);
    const older = list.filter((c) => c.group !== 'Today').map(item);

    const nav = {};
    ['new', 'knowledge', 'skills', 'behavior'].forEach((k) => {
      const on = k === 'new' ? isNew : s.view === k;
      nav[k + 'Cls'] = on ? '' : 'hov';
      nav[k + 'Cur'] = on ? 'page' : 'false';
      nav[k + 'Bg'] = on ? '#FFFFFF' : 'transparent';
      nav[k + 'Shadow'] = on ? '0 1px 2px rgba(0,0,0,0.06)' : 'none';
    });

    const msgs = isChat ? conv.messages.map((m) => {
      const v = s.votes[m.id];
      const key = 'm' + m.id;
      const copied = s.copied === key;
      return {
        text: m.text || '',
        isUser: m.role === 'user',
        isAssistant: m.role === 'assistant',
        isRich: m.rich === 'debounce',
        isPlain: m.role === 'assistant' && !m.rich,
        copied,
        notCopied: !copied,
        copyLabel: copied ? 'Copied' : (m.role === 'user' ? 'Copy message' : 'Copy response'),
        upPressed: v === 'up' ? 'true' : 'false',
        downPressed: v === 'down' ? 'true' : 'false',
        upColor: v === 'up' ? accent : '#63636B',
        downColor: v === 'down' ? accent : '#63636B',
        upFill: v === 'up' ? 'currentColor' : 'none',
        downFill: v === 'down' ? 'currentColor' : 'none',
        onCopy: () => this.copy(key, m.rich ? this.code() : m.text),
        onEdit: () => this.edit(m),
        onUp: () => this.vote(m.id, 'up'),
        onDown: () => this.vote(m.id, 'down'),
        onRegen: () => this.regen(m)
      };
    }) : [];

    const models = [
      { name: 'Opus 5.5', note: 'Most capable, for complex work' },
      { name: 'Sonnet 5.5', note: 'Fast and smart for everyday tasks' },
      { name: 'Haiku 5.5', note: 'Fastest, for quick answers' }
    ].map((o) => ({ ...o, on: o.name === s.model, checked: o.name === s.model ? 'true' : 'false', pick: () => this.setState({ model: o.name, modelMenu: false }) }));

    const chips = [
      { label: 'Write', text: 'Draft a friendly reminder about an unpaid invoice' },
      { label: 'Code', text: 'Explain what this regular expression matches' },
      { label: 'Learn', text: 'How do index funds work, in plain terms?' }
    ].map((c) => ({ ...c, pick: () => this.send(c.text) }));

    const canSend = !!s.draft.trim();
    const showNav = !s.collapsed || s.narrowNav || this.isNarrow();

    return {
      accent,
      anyMenu: s.modelMenu || s.chatMenu,
      closeMenus: () => this.setState({ modelMenu: false, chatMenu: false }),
      showNav,
      navClass: s.narrowNav ? 'side open' : 'side',
      narrowNav: s.narrowNav,
      menuBtnDisplay: s.collapsed ? 'flex' : 'none',
      collapse: () => (this.isNarrow() ? this.setState({ narrowNav: false }) : this.setState({ collapsed: true })),
      openNav: () => (this.isNarrow() ? this.setState({ narrowNav: true, collapsed: false }) : this.setState({ collapsed: false })),
      nav,
      newChat: () => { this.go({ view: 'new', activeId: null, draft: '' }); this.focusComposer(); },
      openKnowledge: () => this.showToast('Knowledge is not part of this prototype'),
      openSkills: () => this.showToast('Skills is not part of this prototype'),
      openBehavior: () => this.showToast('Behavior is not part of this prototype'),
      openSettings: () => this.showToast('Settings are not part of this prototype'),
      searchOpen: s.searchOpen,
      searchExpanded: s.searchOpen ? 'true' : 'false',
      toggleSearch: () => {
        if (s.searchOpen) { this.setState({ searchOpen: false, query: '' }); return; }
        this.setState({ searchOpen: true });
        setTimeout(() => { if (this.searchEl) this.searchEl.focus(); }, 0);
      },
      closeSearch: () => this.setState({ searchOpen: false, query: '' }),
      searchRef: (el) => { this.searchEl = el; },
      query: s.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      today, older,
      hasToday: today.length > 0,
      hasOlder: older.length > 0,
      noResults: !!q && list.length === 0,

      isChat, isNew, isPage, page,
      pageAction: () => this.showToast(page.action + ' is not part of this prototype'),
      headerBorder: isNew ? '#FFFFFF' : '#EDEDF0',
      chatTitle: conv ? conv.title : '',
      chatMenu: s.chatMenu,
      chatMenuExpanded: s.chatMenu ? 'true' : 'false',
      toggleChatMenu: () => this.setState({ chatMenu: !s.chatMenu, modelMenu: false }),
      deleteChat: () => {
        this.stop();
        this.setState((st) => ({ convs: st.convs.filter((c) => c.id !== st.activeId), activeId: null, view: 'new', chatMenu: false }));
        this.showToast('Chat deleted');
      },
      share: () => this.showToast('Link copied to clipboard'),

      msgRef: (el) => { this.msgEl = el; },
      msgs,
      showTyping: s.typing && s.typingConv === s.activeId && isChat,
      wrapPressed: s.wrap ? 'true' : 'false',
      wrapBg: s.wrap ? '#E4E4E8' : 'transparent',
      toggleWrap: () => this.setState({ wrap: !s.wrap }),
      preWS: s.wrap ? 'pre-wrap' : 'pre',
      copyCode: () => this.copy('code', this.code()),
      codeCopyLabel: s.copied === 'code' ? 'Copied' : 'Copy',

      showComposer: isChat || isNew,
      composerPad: isNew ? '0 24px' : '8px 24px 20px',
      composerMax: isNew ? '720px' : '760px',
      rows: isNew ? 3 : 2,
      taRef: (el) => { this.taEl = el; },
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !(e.nativeEvent && e.nativeEvent.isComposing)) { e.preventDefault(); this.send(); }
      },
      onSubmit: (e) => { e.preventDefault(); this.send(); },
      attach: () => this.showToast('File upload is not part of this prototype'),
      voice: () => this.showToast('Voice input is not part of this prototype'),
      model: s.model,
      models,
      modelMenu: s.modelMenu,
      modelMenuExpanded: s.modelMenu ? 'true' : 'false',
      toggleModelMenu: () => this.setState({ modelMenu: !s.modelMenu, chatMenu: false }),
      typing: s.typing,
      notTyping: !s.typing,
      stop: () => this.stop(),
      noSend: !canSend,
      sendBg: canSend ? accent : '#E4E4E8',
      sendColor: canSend ? '#FFFFFF' : '#71717A',
      sendCursor: canSend ? 'pointer' : 'default',
      chips,

      hasToast: !!s.toast,
      toast: s.toast
    };
  }
}

const propDefs = {"accent":{"editor":"color","default":"#3550C8","options":["#3550C8","#0F766E","#C2410C","#18181B"]},"startView":{"editor":"enum","options":["chat","new"],"default":"chat"},"$preview":{"width":1440,"height":900}};
const props = {};
for (const [k, d] of Object.entries(propDefs)) if (!k.startsWith('$')) props[k] = d.default;
const view = new URLSearchParams(location.search).get('view');
if (view) props.startView = view;

createApp({
  template: '#tpl',
  setup() {
    const tick = ref(0);
    const comp = new Component(props);
    comp.tick = tick;
    const v = computed(() => (tick.value, comp.renderVals()));
    onMounted(() => comp.componentDidMount && comp.componentDidMount());
    onUpdated(() => comp.componentDidUpdate && comp.componentDidUpdate());
    onBeforeUnmount(() => comp.componentWillUnmount && comp.componentWillUnmount());
    return { v };
  }
}).mount('#app');
</script>
</body>
</html>
