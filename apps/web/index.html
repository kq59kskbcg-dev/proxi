<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Proxi</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script>
// Applies the saved theme before the page paints. "system" follows the device setting.
(function () {
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  let choice = 'system';
  try { choice = localStorage.getItem('proxi-theme') || 'system'; } catch {}
  const apply = () => { document.documentElement.dataset.theme = choice === 'system' ? (media.matches ? 'dark' : 'light') : choice; };
  apply();
  media.addEventListener('change', apply);
  window.proxiTheme = {
    get: () => choice,
    set: (next) => { choice = next; try { localStorage.setItem('proxi-theme', next); } catch {} apply(); },
  };
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="auth" hidden>
  <span class="auth-mark">proxi</span>
  <p class="auth-text">Sign in to start chatting.</p>
  <button type="button" id="sign-in" class="auth-button">Sign in</button>
  <p class="auth-legal">By signing in, you agree to the <a href="https://proxi.mintlify.site/terms" target="_blank" rel="noopener noreferrer">Terms</a> and <a href="https://proxi.mintlify.site/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy policy</a>.</p>
</div>
<div id="app"></div>

<script type="text/x-template" id="tpl">
<div class="app" @dragover="v.onDragOver" @dragleave="v.onDragLeave" @drop="v.onDrop" :style="`--accent: ${v.accent}; overflow: hidden; display: flex; background: var(--bg); font-family: Inter, system-ui, sans-serif; color: var(--text); font-size: 15px`">

  <template v-if="v.anyMenu">
    <button aria-label="Close menu" tabindex="-1" @click="v.closeMenus" style="position: absolute; inset: 0; z-index: 30; border: 0; padding: 0; margin: 0; background: transparent; cursor: default"></button>
  </template>
  <button aria-label="Close sidebar" tabindex="-1" :class="v.narrowNav ? 'scrim on' : 'scrim'" @click="v.collapse"></button>

  <!-- Confirm deleting the account: a window on a computer, a sheet from the bottom on a phone. -->
  <template v-if="v.deleteAccountOpen">
    <div class="confirm-layer" @click="v.deleteAccountBackdrop" @keydown="v.deleteAccountKey">
      <div class="confirm-panel pop" role="dialog" aria-modal="true" aria-labelledby="delete-account-title">
        <h2 id="delete-account-title" style="margin: 0; font-size: 18px; font-weight: 600">Delete your account?</h2>
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-2)">This deletes your chats, memories, settings and the monitoring traces of your chats. Shared links stop working. You can't undo this.</p>
        <div style="display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 8px">
          <button type="button" :ref="v.cancelDeleteRef" :disabled="v.deletingAccount" @click="v.cancelDeleteAccount" style="flex: 1 1 120px; height: 44px; border: 1px solid var(--border); border-radius: 10px; padding: 0 16px; font-size: 14px; font-weight: 500; background: var(--surface); color: var(--text); cursor: pointer">Cancel</button>
          <button type="button" :disabled="v.deletingAccount" @click="v.confirmDeleteAccount" style="flex: 1 1 160px; height: 44px; border: 0; border-radius: 10px; padding: 0 16px; font-size: 14px; font-weight: 600; background: var(--danger); color: #FFFFFF; cursor: pointer">{{ v.deleteAccountLabel }}</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Chat search: a small window on a computer, the whole screen on a phone. -->
  <template v-if="v.searchOpen">
    <div class="search-layer" @click="v.searchBackdrop">
      <div class="search-panel pop" role="dialog" aria-modal="true" aria-label="Search chats">
        <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border)">
          <div style="flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px; background: var(--sunken)">
            <svg style="flex: none; color: var(--text-muted)" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input id="chat-search" :ref="v.searchRef" type="text" enterkeyhint="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats" aria-controls="search-results" :value="v.query" @input="v.onQuery" @keydown="v.onSearchKey" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; color: var(--text); outline: none">
          </div>
          <button type="button" class="phone-only" @click="v.closeSearch" style="flex: none; height: 40px; border: 0; background: transparent; padding: 0 6px; font-size: 15px; font-weight: 500; color: var(--link); cursor: pointer">Cancel</button>
          <button type="button" class="desk-only hov" @click="v.closeSearch" aria-label="Close search" style="flex: none; height: 28px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 0 6px; font-size: 11px; color: var(--text-muted-2); cursor: pointer">Esc</button>
        </div>
        <div id="search-results" role="listbox" aria-label="Chats" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px; display: flex; flex-direction: column">
          <template v-if="v.searchLabel"><div class="search-group">{{ v.searchLabel }}</div></template>
          <template v-for="r in v.searchResults" :key="r.key">
            <template v-if="r.group"><div class="search-group">{{ r.group }}</div></template>
            <button type="button" class="search-row hov" role="option" :title="r.when" :aria-selected="r.selected" @click="r.open" @mousemove="r.hover" style="flex: none; border: 0; background: transparent; border-radius: 8px; padding: 10px 8px; display: flex; align-items: baseline; gap: 12px; text-align: left; font-size: 14px; color: var(--text); cursor: pointer">
              <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><template v-for="(part, i_p) in r.parts" :key="i_p"><template v-if="part.hit"><mark class="search-hit">{{ part.text }}</mark></template><template v-if="!part.hit">{{ part.text }}</template></template></span>
            </button>
          </template>
          <template v-if="v.searchEmpty">
            <p style="margin: 0; padding: 10px 8px; font-size: 14px; color: var(--text-muted)">{{ v.searchEmpty }}</p>
          </template>
        </div>
        <div class="desk-only" style="flex: none; display: flex; gap: 14px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted-2)">
          <span>↑ ↓ move</span><span>Enter open</span><span>Esc close</span>
        </div>
      </div>
    </div>
  </template>

  <template v-if="v.showNav">
  <nav :class="v.navClass" aria-label="Conversations" style="flex: 0 0 280px; max-height: 100%; overflow: hidden; box-sizing: border-box; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column">
    <div class="nav-pin" style="flex: none; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 12px">
    <!-- 64px tall with the icon 20px from the left, the same spot as in the top bar, so it doesn't move when the sidebar opens or closes. -->
    <div style="flex: none; height: 64px; display: flex; align-items: center; gap: 6px; padding: 0 8px">
      <button class="hov" aria-label="Close sidebar" @click="v.collapse" style="flex: none; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>
      </button>
      <span style="font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.04em; line-height: 1">proxi</span>
    </div>

    <button class="hov search-entry" @click="v.openSearch" aria-haspopup="dialog" style="flex: none; height: 40px; border: 0; border-radius: 10px; background: var(--sunken); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 14px; color: var(--placeholder); cursor: pointer; text-align: left">
      <svg style="flex: none; color: var(--text-muted)" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="flex: 1; min-width: 0">Search chats</span>
      <kbd class="desk-only" style="font: inherit; font-size: 11px; color: var(--text-muted-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; background: var(--surface)">{{ v.searchShortcut }}</kbd>
    </button>

    </div>

    <div @scroll="v.navScroll" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <button :class="v.nav.newCls" :aria-current="v.nav.newCur" @click="v.newChat" :style="`height: 44px; border: 0; background: ${v.nav.newBg}; box-shadow: ${v.nav.newShadow}; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer`">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        New chat
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0">
      <div style="display: flex; align-items: center; min-height: 34px; padding: 4px 4px 2px 10px; box-sizing: border-box">
        <span style="font-size: 12px; font-weight: 600; color: var(--text-muted-2); letter-spacing: 0.02em">Recents</span>
      </div>
      <template v-for="(c, i_c) in v.recents" :key="i_c">
          <button :class="c.cls" :aria-current="c.current" @click="c.open" :style="`border: 0; text-align: left; cursor: pointer; color: ${c.color}; background: ${c.bg}; box-shadow: ${c.shadow}; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-weight: ${c.weight}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis`">{{ c.title }}</button>
      </template>
      <template v-if="v.hasMore">
        <button class="hov" type="button" @click="v.openSearch" aria-haspopup="dialog" style="border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--text-muted-2)">View all</button>
      </template>
      <template v-if="v.historyNote">
        <p style="margin: 0; padding: 6px 10px; font-size: 13px; line-height: 1.45; color: var(--text-muted-2)">{{ v.historyNote }}
          <template v-if="v.historyRetry"><button class="hov" @click="v.historyRetry" style="margin-left: 2px; border: 0; background: transparent; padding: 2px 4px; border-radius: 6px; font: inherit; color: var(--link-hover); text-decoration: underline; cursor: pointer">Try again</button></template>
        </p>
      </template>
    </div>

    </div>

    <div style="flex: none; position: relative; margin: 0 12px; display: flex; align-items: center; gap: 4px; padding: 8px 0 8px; border-top: 1px solid var(--border)">
      <button class="hov" aria-haspopup="menu" :aria-expanded="v.userMenuExpanded" @click="v.toggleUserMenu" style="flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; border-radius: 10px; padding: 0 8px; display: flex; align-items: center; gap: 10px; color: var(--text); cursor: pointer; text-align: left">
        <template v-if="v.userImage">
          <img :src="v.userImage" alt="" style="flex: none; width: 32px; height: 32px; border-radius: 50%; object-fit: cover">
        </template>
        <template v-if="!v.userImage">
          <span aria-hidden="true" :style="`flex: none; width: 32px; height: 32px; border-radius: 50%; background: ${v.accent}; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center`">{{ v.userInitial }}</span>
        </template>
        <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ v.userName }}</span>
        <svg style="flex: none; color: var(--text-muted)" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
      <template v-if="v.userMenu">
        <div class="pop" role="menu" style="position: absolute; bottom: 60px; left: 0; right: 0; z-index: 31; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(24,24,27,0.12); padding: 6px">
          <button class="menu-item" role="menuitem" @click="v.openSettings" style="width: 100%; height: 40px; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
            Settings
          </button>
          <a class="menu-item" role="menuitem" :href="v.docsHome" target="_blank" rel="noopener noreferrer" @click="v.closeUserMenu" style="width: 100%; height: 40px; box-sizing: border-box; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); text-decoration: none; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 3.8"></path><path d="M12 17h.01"></path></svg>
            Help Center
            <svg style="margin-left: auto; color: var(--text-muted-2)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
          </a>
          <button class="menu-item" role="menuitem" @click="v.logout" style="width: 100%; height: 40px; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5"></path><path d="M5 12h11"></path></svg>
            Logout
          </button>
        </div>
      </template>
    </div>
  </nav>
  </template>

  <main :style="`flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); overflow-y: ${v.isNew ? 'auto' : 'visible'}; overscroll-behavior: contain`">
    <header :style="`flex: none; ${v.isNew ? 'position: sticky; top: 0; z-index: 5;' : ''} background: var(--surface); height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 20px; border-bottom: 1px solid ${v.headerBorder}`">
      <div style="display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1 1 auto">
        <button class="menu-btn hov" aria-label="Open sidebar" @click="v.openNav" :style="`display: ${v.menuBtnDisplay}; flex: none; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: var(--text-muted); align-items: center; justify-content: center; cursor: pointer`">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>
        </button>
        <template v-if="v.isChat">
          <div style="position: relative; min-width: 0">
            <button class="hov" :aria-label="`${v.chatTitle}, chat options`" :aria-expanded="v.chatMenuExpanded" @click="v.toggleChatMenu" style="max-width: 100%; height: 40px; border: 0; background: transparent; border-radius: 10px; padding: 0 10px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer">
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ v.chatTitle }}</span>
              <svg style="flex: none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
            </button>
            <template v-if="v.chatMenu">
              <div class="pop" role="menu" style="position: absolute; top: 46px; left: 0; z-index: 31; min-width: 200px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(24,24,27,0.12); padding: 6px">
                <button class="menu-item" role="menuitem" @click="v.deleteChat" style="width: 100%; height: 40px; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--danger); cursor: pointer">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
                  Delete chat
                </button>
              </div>
            </template>
          </div>
        </template>
        <template v-if="v.isSettings">
          <h1 style="margin: 0; padding: 0 10px; font-size: 15px; font-weight: 600">Settings</h1>
        </template>
      </div>
      <template v-if="v.isChat">
        <template v-if="v.canShare">
          <div style="position: relative; flex: none">
            <button class="hov" @click="v.share" :aria-haspopup="v.shareHasPopup" :aria-expanded="v.shareMenuExpanded" :style="`height: 40px; border: 1px solid ${v.shareBorder}; background: ${v.shareBg}; border-radius: 10px; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: ${v.shareColor}; cursor: pointer`">
              <template v-if="v.isShared"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>Shared</template>
              <template v-if="v.notShared"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>Share</template>
            </button>
            <template v-if="v.shareMenu">
              <div class="pop" role="menu" style="position: absolute; top: 46px; right: 0; z-index: 31; width: 230px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(24,24,27,0.12); padding: 6px">
                <button class="menu-item" role="menuitem" @click="v.copyShareLink" style="width: 100%; height: 40px; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h10"></path></svg>
                  Copy link
                </button>
                <button class="menu-item" role="menuitem" @click="v.stopSharing" style="width: 100%; height: 40px; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--danger); cursor: pointer">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                  Stop sharing
                </button>
                <p style="margin: 4px 10px 6px; font-size: 12px; line-height: 1.45; color: var(--text-muted-2)">New messages in this chat also become visible.</p>
              </div>
            </template>
          </div>
        </template>
      </template>
      <template v-if="v.isNew">

          <div style="order: 3; margin-left: auto; position: relative; display: flex; align-items: center; gap: 4px">
            <button class="hov" type="button" :aria-label="`Model: ${v.model}, change model`" :aria-expanded="v.modelMenuExpanded" @click="v.toggleModelMenu" style="margin-left: auto; height: 44px; border: 0; background: transparent; border-radius: 22px; padding: 0 4px; display: flex; align-items: center; cursor: pointer"><span style="height: 34px; padding: 0 6px 0 8px; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--text-muted)"><span>{{ v.modelName }}<span v-if="v.modelVersion" class="model-ver">&nbsp;{{ v.modelVersion }}</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></button>
            <template v-if="v.modelMenu">
              <div class="pop" role="menu" style="position: absolute; bottom: 52px; right: 44px; z-index: 31; width: 220px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(24,24,27,0.12); padding: 6px">
                <template v-for="(o, i_o) in v.models" :key="i_o">
                  <button class="menu-item" role="menuitemradio" :aria-checked="o.checked" @click="o.pick" style="width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; color: var(--text)">
                    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                      <span style="font-size: 14px; font-weight: 500">{{ o.name }}</span>
                      <span style="font-size: 12px; color: var(--text-muted-2)">{{ o.note }}</span>
                    </span>
                    <template v-if="o.on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" :stroke="v.accent" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></template>
                  </button>
                </template>
              </div>
            </template>
            <template v-if="v.typing">
              <button type="button" aria-label="Stop generating" @click="v.stop" style="flex: none; width: 44px; height: 44px; border: 0; background: var(--inverse); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 12px; height: 12px; border-radius: 2px; background: var(--on-inverse)"></span></button>
            </template>
            <template v-if="v.notTyping">
              <button type="submit" aria-label="Send message" :disabled="v.noSend" :style="`flex: none; width: 44px; height: 44px; border: 0; background: ${v.sendBg}; border-radius: 50%; color: ${v.sendColor}; display: flex; align-items: center; justify-content: center; cursor: ${v.sendCursor}`"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
            </template>
          </div>
        </div>
        <p style="margin: 0; text-align: center; font-size: 12px; color: var(--text-muted-2)">Proxi can make mistakes. Check important info.</p>
      </form>
    </div>
    </template>
  </main>

  <template v-if="v.hasToast">
    <div class="toast" role="status" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50; background: var(--inverse); color: var(--on-inverse); font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(24,24,27,0.2); width: max-content; max-width: min(92vw, 460px); text-align: center; line-height: 1.4">{{ v.toast }}</div>
  </template>
</div>
</script>
