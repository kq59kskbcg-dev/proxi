<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Proxi</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script>
// Applies the saved theme before the page paints. "system" follows the device setting.
(function () {
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  let choice = 'system';
  try { choice = localStorage.getItem('proxi-theme') || 'system'; } catch {}
  const apply = () => { document.documentElement.dataset.theme = choice === 'system' ? (media.matches ? 'dark' : 'light') : choice; };
  apply();
  media.addEventListener('change', apply);
  window.proxiTheme = {
    get: () => choice,
    set: (next) => { choice = next; try { localStorage.setItem('proxi-theme', next); } catch {} apply(); },
  };
})();
</script>
<style>
:root{--app-h:100vh;color-scheme:light;
--bg:#FAFAFB;--surface:#FFFFFF;--side:#F6F5F9;--sunken:#F1F1F4;--soft:#FBFBFC;--hover-solid:#F4F4F6;--hover:rgba(24,24,27,0.06);
--divider:#EDEDF0;--disabled:#E4E4E8;--border:#E7E5EE;--border-strong:#D4D4DA;--border-hover:#C4C4CC;
--accent-line:#DDD6FE;--accent-soft:#EFE8FF;--temp-border:#A78BFA;--link:#6D28FF;--link-hover:#5214E0;
--text:#111111;--text-code:#27272A;--text-2:#3F3F46;--text-muted:#52525B;--text-muted-2:#5C5C66;--text-muted-3:#63636B;--placeholder:#6B6B74;--text-disabled:#71717A;
--danger:#B42318;--inverse:#111111;--inverse-hover:#2A2A2E;--on-inverse:#FFFFFF}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#121116;--surface:#18171D;--side:#141318;--sunken:#26242D;--soft:#1E1D24;--hover-solid:#24222B;--hover:rgba(255,255,255,0.07);
--divider:#26242D;--disabled:#2E2C36;--border:#2C2A34;--border-strong:#3A3843;--border-hover:#4A4754;
--accent-line:#4A3B82;--accent-soft:#2A2340;--temp-border:#8B76D9;--link:#A78BFA;--link-hover:#C4B5FD;
--text:#ECEBF1;--text-code:#DAD9E0;--text-2:#C9C8D1;--text-muted:#A9A8B3;--text-muted-2:#A1A0AB;--text-muted-3:#9A99A4;--placeholder:#8A8994;--text-disabled:#7D7C87;
--danger:#F97066;--inverse:#ECEBF1;--inverse-hover:#D6D5DD;--on-inverse:#111111}
@supports (height:100dvh){:root{--app-h:100dvh}}
body{margin:0;background:var(--bg)}
.app{position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h)}
.app-mode,.app-mode body{overflow:hidden;overscroll-behavior:none}
a{color:var(--link)}a:hover{color:var(--link-hover)}
button{font-family:inherit}
textarea,input{font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--placeholder)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.composer:focus-within,.composer.drop{border-color:var(--accent) !important;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent) !important}
.hov:hover{background:var(--hover) !important}
.chip:hover{background:var(--bg) !important;border-color:var(--border-hover) !important}
.menu-item:hover{background:var(--sunken) !important}
.legal-link:hover{color:var(--text) !important;text-decoration:underline !important}
.umsg .uact{opacity:0}
.umsg:hover .uact,.umsg:focus-within .uact{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{animation:spin 0.8s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes toast-rise{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{animation:toast-rise 0.16s ease-out}
.pop{animation:rise 0.16s ease-out}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:2.4s}.pop,.toast{animation:none}}
#instructions:focus{outline:none;border-color:var(--accent) !important;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent)}
.temp-toggle[aria-pressed="false"]:hover{background:var(--hover-solid) !important}
@media (max-width: 480px){.model-ver{display:none}}
#composer::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps summary::-webkit-details-marker{display:none}
.steps-chev{transition:transform 0.15s}
.steps[open] .steps-chev{transform:rotate(90deg)}
.steps-card{margin-top:10px;border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:14px 16px}
.steps-list{list-style:none;margin:0;padding:0}
.steps-list li{display:flex;align-items:center;gap:12px;position:relative;font-size:13px;color:var(--text-2);line-height:18px}
.steps-list li+li{margin-top:14px}
.steps-list li:not(:last-child)::after{content:"";position:absolute;left:11.25px;top:calc(50% + 12px);height:calc(100% + 14px - 24px);width:1.5px;background:var(--accent-line)}
.steps-mark{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--link);display:flex;align-items:center;justify-content:center}
.scrim{display:none}
@media (min-width: 831px){
.side{transition:margin-left 0.3s cubic-bezier(0.32,0.72,0,1),visibility 0.3s}
.side.collapsed{margin-left:-280px;visibility:hidden}
}
@media (max-width: 830px){
.side{display:flex !important;position:absolute;top:0;left:0;bottom:0;width:280px;z-index:40;transform:translateX(-100%);visibility:hidden;transition:transform 0.3s cubic-bezier(0.32,0.72,0,1),visibility 0.3s,box-shadow 0.3s}
.side.open{transform:none;visibility:visible;box-shadow:8px 0 24px rgba(24,24,27,0.16)}
.scrim{display:block;position:absolute;inset:0;z-index:39;border:0;padding:0;margin:0;background:rgba(24,24,27,0.25);cursor:default;opacity:0;pointer-events:none;transition:opacity 0.25s ease}
.scrim.on{opacity:1;pointer-events:auto}
.menu-btn{display:flex !important}
}
@media (prefers-reduced-motion: reduce){.side,.scrim{transition:none !important}}
.resizing .side,.resizing .scrim{transition:none !important}
.md{overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md table{margin:0 0 14px}
.md h1,.md h2,.md h3,.md h4{margin:20px 0 10px;font-size:16px;font-weight:600;line-height:1.4}
.md h1{font-size:20px}.md h2{font-size:18px}
.md ul,.md ol{padding-left:22px}.md li{margin:4px 0}
.md a{color:var(--link);text-underline-offset:3px}
.md code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;background:var(--sunken);padding:2px 6px;border-radius:5px}
.md pre{border:1px solid var(--border);border-radius:12px;background:var(--soft);padding:16px;overflow-x:auto;line-height:1.7}
.md pre code{background:none;padding:0;border-radius:0;color:var(--text-code)}
.md blockquote{border-left:3px solid var(--border);padding-left:14px;color:var(--text-muted)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.md .cite{display:inline-flex;align-items:center;height:20px;padding:0 8px;margin-left:4px;border-radius:10px;background:var(--sunken);color:var(--text-muted);font-size:12px;font-weight:500;line-height:1;text-decoration:none;vertical-align:1px;white-space:nowrap}
.md .cite:hover{background:var(--accent-soft);color:var(--link)}
.md .sources{margin-top:14px}
.md .sources summary{list-style:none;display:inline-flex;align-items:center;gap:8px;height:32px;box-sizing:border-box;padding:0 12px 0 6px;border:1px solid var(--border);border-radius:16px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer}
.md .sources summary::-webkit-details-marker{display:none}
.md .sources summary:hover{background:var(--soft);border-color:var(--border-hover)}
.src-stack{display:flex}
.src-tile{width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#FFFFFF}
.src-tile:first-child{margin-left:0}
.src-tile.t0{background:#6D28FF}.src-tile.t1{background:#0F7B5F}.src-tile.t2{background:#F4511E}.src-tile.t3{background:#2563EB}.src-tile.t4{background:#B45309}
.md .sources ul{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.md .sources li{margin:0}
.md .sources li+li{border-top:1px solid var(--border)}
.md .sources li a{display:flex;flex-direction:column;gap:2px;padding:10px 14px;text-decoration:none;color:var(--text)}
.md .sources li a:hover{background:var(--soft)}
.src-title{font-size:14px;font-weight:500}
.src-host{font-size:12px;color:var(--text-muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:16px 0}
#auth{min-height:100vh;min-height:100dvh;box-sizing:border-box;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:28px;background:var(--bg);font-family:Inter,system-ui,sans-serif}
#auth[hidden]{display:none}
.auth-mark{font-family:Manrope,Inter,sans-serif;font-weight:800;font-size:40px;letter-spacing:-0.04em;line-height:1;color:var(--text)}
.auth-text{margin:0;font-size:15px;color:var(--text-muted)}
.auth-legal{margin:0;max-width:360px;text-align:center;font-size:13px;line-height:1.5;color:var(--text-muted-2)}
.auth-legal a{white-space:nowrap;color:inherit;text-decoration:underline;text-underline-offset:2px}
.auth-legal a:hover{color:var(--text)}
.auth-button{min-width:200px;height:48px;border:0;border-radius:10px;background:var(--inverse);color:var(--on-inverse);font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.auth-button:hover{background:var(--inverse-hover)}
.auth-button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
</style>
</head>
<body>
<div id="auth" hidden>
  <span class="auth-mark">proxi</span>
  <p class="auth-text">Sign in to start chatting.</p>
  <button type="button" id="sign-in" class="auth-button">Sign in</button>
  <p class="auth-legal">By signing in, you agree to the <a href="https://proxi.mintlify.site/terms" target="_blank" rel="noopener noreferrer">Terms</a> and <a href="https://proxi.mintlify.site/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy policy</a>.</p>
</div>
<div id="app"></div>

<script type="text/x-template" id="tpl">
<div class="app" @dragover="v.onDragOver" @dragleave="v.onDragLeave" @drop="v.onDrop" :style="`--accent: ${v.accent}; overflow: hidden; display: flex; background: var(--bg); font-family: Inter, system-ui, sans-serif; color: var(--text); font-size: 15px`">

  <template v-if="v.anyMenu">
    <button aria-label="Close menu" tabindex="-1" @click="v.closeMenus" style="position: absolute; inset: 0; z-index: 30; border: 0; padding: 0; margin: 0; background: transparent; cursor: default"></button>
  </template>
  <button aria-label="Close sidebar" tabindex="-1" :class="v.narrowNav ? 'scrim on' : 'scrim'" @click="v.collapse"></button>

  <template v-if="v.showNav">
  <nav :class="v.navClass" aria-label="Conversations" style="flex: 0 0 280px; max-height: 100%; overflow: hidden; box-sizing: border-box; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column">
    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.04em; line-height: 1">proxi</span>
      </div>
      <button class="hov" aria-label="Collapse sidebar" @click="v.collapse" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <button :class="v.nav.newCls" :aria-current="v.nav.newCur" @click="v.newChat" :style="`height: 44px; border: 0; background: ${v.nav.newBg}; box-shadow: ${v.nav.newShadow}; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer`">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        New chat
      </button>
      <button :class="v.nav.skillsCls" :aria-current="v.nav.skillsCur" @click="v.openSkills" :style="`height: 44px; border: 0; background: ${v.nav.skillsBg}; box-shadow: ${v.nav.skillsShadow}; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer`">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
        Skills
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 2px 10px">
        <span style="font-size: 12px; font-weight: 600; color: var(--text-muted-2); letter-spacing: 0.02em">Recents</span>
        <button class="hov" aria-label="Search chats" :aria-expanded="v.searchExpanded" @click="v.toggleSearch" style="width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
      </div>
      <template v-if="v.searchOpen">
  <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; border-radius: 8px; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,0.06)">
          <svg style="flex: none; color: var(--text-muted)" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <label for="chat-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search chats</label>
          <input id="chat-search" :ref="v.searchRef" type="search" placeholder="Search chats" :value="v.query" @input="v.onQuery" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 14px; color: var(--text); outline: none">
          <button class="hov" aria-label="Close search" @click="v.closeSearch" style="width: 36px; height: 36px; border: 0; background: transparent; border-radius: 8px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </template>
      <template v-if="v.hasToday">
        <template v-for="(c, i_c) in v.today" :key="i_c">
          <button :class="c.cls" :aria-current="c.current" @click="c.open" :style="`border: 0; text-align: left; cursor: pointer; color: ${c.color}; background: ${c.bg}; box-shadow: ${c.shadow}; border-radius: 8px; padding: 10px 10px; font-size: 14px; font-weight: ${c.weight}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis`">{{ c.title }}</button>
        </template>
      </template>
      <template v-if="v.hasOlder">
        <div style="font-size: 12px; font-weight: 600; color: var(--text-muted-2); padding: 16px 10px 6px; letter-spacing: 0.02em">Earlier</div>
        <template v-for="(c, i_c) in v.older" :key="i_c">
          <button :class="c.cls" :aria-current="c.current" @click="c.open" :style="`border: 0; text-align: left; cursor: pointer; color: ${c.color}; background: ${c.bg}; box-shadow: ${c.shadow}; border-radius: 8px; padding: 10px 10px; font-size: 14px; font-weight: ${c.weight}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis`">{{ c.title }}</button>
        </template>
      </template>
      <template v-if="v.historyNote">
        <p style="margin: 0; padding: 6px 10px; font-size: 13px; line-height: 1.45; color: var(--text-muted-2)">{{ v.historyNote }}
          <template v-if="v.historyRetry"><button class="hov" @click="v.historyRetry" style="margin-left: 2px; border: 0; background: transparent; padding: 2px 4px; border-radius: 6px; font: inherit; color: var(--link-hover); text-decoration: underline; cursor: pointer">Try again</button></template>
        </p>
      </template>
      <template v-if="v.noResults">
        <p style="margin: 0; padding: 10px; font-size: 14px; color: var(--text-muted)">No chats match "{{ v.query }}".</p>
      </template>
    </div>

    </div>

    <div style="flex: none; position: relative; margin: 0 12px; display: flex; align-items: center; gap: 4px; padding: 8px 0 8px; border-top: 1px solid var(--border)">
      <button class="hov" aria-haspopup="menu" :aria-expanded="v.userMenuExpanded" @click="v.toggleUserMenu" style="flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; border-radius: 10px; padding: 0 8px; display: flex; align-items: center; gap: 10px; color: var(--text); cursor: pointer; text-align: left">
        <template v-if="v.userImage">
          <img :src="v.userImage" alt="" style="flex: none; width: 32px; height: 32px; border-radius: 50%; object-fit: cover">
        </template>
        <template v-if="!v.userImage">
          <span aria-hidden="true" :style="`flex: none; width: 32px; height: 32px; border-radius: 50%; background: ${v.accent}; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center`">{{ v.userInitial }}</span>
        </template>
        <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ v.userName }}</span>
        <svg style="flex: none; color: var(--text-muted)" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
      <template v-if="v.userMenu">
        <div class="pop" role="menu" style="position: absolute; bottom: 60px; left: 0; right: 0; z-index: 31; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(24,24,27,0.12); padding: 6px">
          <a class="menu-item" role="menuitem" :href="v.docsHome" target="_blank" rel="noopener noreferrer" @click="v.closeUserMenu" style="width: 100%; height: 40px; box-sizing: border-box; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); text-decoration: none; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 3.8"></path><path d="M12 17h.01"></path></svg>
            Help Center
            <svg style="margin-left: auto; color: var(--text-muted-2)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
          </a>
          <a class="menu-item" role="menuitem" :href="v.docsPrivacy" target="_blank" rel="noopener noreferrer" @click="v.closeUserMenu" style="width: 100%; height: 40px; box-sizing: border-box; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); text-decoration: none; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            Privacy
            <svg style="margin-left: auto; color: var(--text-muted-2)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
          </a>
          <a class="menu-item" role="menuitem" :href="v.docsSecurity" target="_blank" rel="noopener noreferrer" @click="v.closeUserMenu" style="width: 100%; height: 40px; box-sizing: border-box; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--text); text-decoration: none; cursor: pointer">

// Minimal stand-in for the Design canvas runtime: a React-style class
// component (state, setState, lifecycle) rendered through Vue.

// Replies are Markdown; sanitize the HTML so a reply can never inject scripts.
DOMPurify.addHook('afterSanitizeAttributes', (node) => {
  if (node.tagName === 'A') { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
});
function renderMarkdown(text) {

const DOCS_URL = 'https://proxi.mintlify.site';

// Citations arrive as Markdown: [[1]](url) after a sentence and a "Sources" list at the end.
// Turn them into source name pills and a collapsible list. Runs on sanitized HTML.
function renderCitations(html) {
  if (!html.includes('<strong>Sources</strong>')) return html;
  const root = document.createElement('template');
  root.innerHTML = html;
  const heading = [...root.content.querySelectorAll('p')].find((p) => p.textContent.trim() === 'Sources' && p.querySelector('strong'));
  const list = heading?.nextElementSibling;
  if (!list || list.tagName !== 'OL') return html;
  const host = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const label = (url) => url.startsWith(DOCS_URL) ? 'Help center' : host(url);
  const sources = [...list.querySelectorAll('a')].map((a) => ({ url: a.getAttribute('href'), title: a.textContent }));
  const link = (url, cls) => {
    const a = document.createElement('a');
    a.href = url; a.className = cls; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  };
  // Consecutive [n] links become one pill: "Help center +1".
  const cites = [...root.content.querySelectorAll('a')].filter((a) => /^\[\d+\]$/.test(a.textContent));
  const groups = [];
  for (const a of cites) {
    const last = groups.at(-1);
    if (last && last.at(-1).nextSibling === a) last.push(a); else groups.push([a]);
  }
  for (const group of groups) {
    const url = group[0].getAttribute('href');
    const pill = link(url, 'cite');
    pill.textContent = label(url) + (group.length > 1 ? ' +' + (group.length - 1) : '');
    pill.title = group.map((a) => sources.find((s) => s.url === a.getAttribute('href'))?.title || label(a.getAttribute('href'))).join('\n');
    group[0].replaceWith(pill);
    group.slice(1).forEach((a) => a.remove());
  }
  const details = document.createElement('details');
  details.className = 'sources';
  const summary = document.createElement('summary');
  const stack = document.createElement('span');
  stack.className = 'src-stack';
  stack.setAttribute('aria-hidden', 'true');
  // One tile per site, up to three.
  for (const name of [...new Set(sources.map((src) => label(src.url) || '?'))].slice(0, 3)) {
    const tile = document.createElement('span');
    tile.className = 'src-tile t' + ([...name].reduce((n, ch) => n + ch.charCodeAt(0), 0) % 5);
    tile.textContent = name[0].toUpperCase();
    stack.append(tile);
  }
  summary.append(stack, sources.length === 1 ? '1 source' : sources.length + ' sources');
  const ul = document.createElement('ul');
  for (const src of sources) {
    const a = link(src.url, '');
    const title = document.createElement('span');
    title.className = 'src-title'; title.textContent = src.title;
    const site = document.createElement('span');
    site.className = 'src-host'; site.textContent = host(src.url);
    a.append(title, site);
    const li = document.createElement('li');
    li.append(a);
    ul.append(li);
  }
  details.append(summary, ul);
  heading.replaceWith(details);
  list.remove();
  return root.innerHTML;
}

function maskCards(text) {
  return text.replace(/\b\d(?:[ -]?\d){12,18}\b/g, (match) => {
    const digits = match.replace(/\D/g, '');
    let sum = 0;
    for (let i = 0; i < digits.length; i++) {
      let d = Number(digits[digits.length - 1 - i]);
      if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
      sum += d;
    }
    return sum % 10 === 0 ? '•••• •••• •••• ' + digits.slice(-4) : match;
  });
}

// The visible viewport shrinks when the browser bar shows or the keyboard opens, and
// on iOS it also pans. Tracking it keeps the app exactly the size of what is visible.
function trackViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const root = document.documentElement;
  let frame = 0;
  const apply = () => {
    frame = 0;
    if (vv.scale > 1.01) { // pinch-zoomed: leave sizing to the browser
      root.style.removeProperty('--app-h');
      root.style.removeProperty('--app-top');
      return;
    }
    root.style.setProperty('--app-h', vv.height + 'px');
    root.style.setProperty('--app-top', vv.offsetTop + 'px');
  };
  const schedule = () => { if (!frame) frame = requestAnimationFrame(apply); };
  vv.addEventListener('resize', schedule);
  vv.addEventListener('scroll', schedule);
  apply();
}

  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path>'

const TOOL_ICONS = { search_docs: 'book', web_search: 'globe', get_status: 'pulse' };
function toStep(a) {

function stepIcon(name) {

}

const REDACTED_NAMES = { CARD: ['card number', 'card numbers'], IBAN: ['IBAN', 'IBANs'], EMAIL: ['email address', 'email addresses'], PHONE: ['phone number', 'phone numbers'] };
function redactionSteps(counts) {
  const parts = Object.entries(counts || {}).filter(([, n]) => n > 0)
    .map(([k, n]) => n + ' ' + (REDACTED_NAMES[k] ? REDACTED_NAMES[k][n === 1 ? 0 : 1] : k));
  if (!parts.length) return [];
  const list = parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1] : parts[0];
  return [{ done: 'Redacted personal data', detail: 'Removed ' + list + ' before sending', icon: 'shield' }];
}

// ---- Attachments: images, PDFs and plain text, checked here and again on the server ----
const MAX_FILES = 3;
const MAX_TOTAL = 3000000;
const MAX_TEXT = 200000;
const IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|json|xml|html|css|js|mjs|ts|tsx|jsx|py|rb|go|rs|java|kt|swift|c|h|cpp|cs|php|sh|sql|ya?ml|toml|ini|log)$/i;
const ACCEPT = IMAGE_TYPES.join(',') + ',application/pdf,text/*,' + TEXT_EXT.source.match(/\(([^)]*)\)/)[1].split('|').map((e) => '.' + e.replace('ya?ml', 'yaml')).join(',') + ',.yml';
const KIND_LABELS = { image: 'Image', pdf: 'PDF', text: 'File' };

function classify(file) {
  if (IMAGE_TYPES.includes(file.type)) return 'image';
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return 'pdf';
  if (file.type.startsWith('text/') || file.type === 'application/json' || TEXT_EXT.test(file.name)) return 'text';
  return null;
}

function formatSize(bytes) {
  return bytes < 1024 ? bytes + ' B' : bytes < 1048576 ? Math.round(bytes / 1024) + ' KB' : (bytes / 1048576).toFixed(1) + ' MB';
}

function readBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// A small preview, so chats never hold a full-size image data URL in the page.
async function makeThumb(file) {
  try {
    const bitmap = await createImageBitmap(file);
    const size = 64;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const scale = Math.max(size / bitmap.width, size / bitmap.height);
    canvas.getContext('2d').drawImage(bitmap, (size - bitmap.width * scale) / 2, (size - bitmap.height * scale) / 2, bitmap.width * scale, bitmap.height * scale);
    if (bitmap.close) bitmap.close();
    return canvas.toDataURL('image/jpeg', 0.7);
  } catch (e) {
    return '';
  }
}

class DCLogic {
  constructor(props) { this.props = props; }
  setState(update) {
    const patch = typeof update === 'function' ? update(this.state) : update;
    if (!patch) return;
    this.state = { ...this.state, ...patch };
    this.tick.value++;
  }
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.nextId = 100;
    this.timers = [];
    this.sig = '';
    this.state = {
      convs: [],
      activeId: null,
      view: 'new',
      draft: '',
      composerTall: false,
      typing: false,
      typingConv: null,
      replyStarted: false,
      activity: [],
      verbTick: 0,
      pending: [],
      reading: false,
      history: 'loading',
      dragging: false,
      model: 'Haiku 5.5',
      modelMenu: false,
      chatMenu: false,
      userMenu: false,
      searchOpen: false,
      query: '',
      collapsed: false,
      narrowNav: false,
      copied: null,
      toast: '',
      settings: null,
      settingsBusy: false,
      instructionsDraft: '',
      theme: window.proxiTheme?.get() || 'system',
      temporary: false,
      votes: {}
    };
  }

  componentDidMount() {
    this.loadConversations();
    // Crossing the mobile breakpoint: close the mobile menu and skip the slide animations.
    try {
      this.mq = window.matchMedia('(max-width: 830px)');
      this.onBreakpoint = () => {
        document.documentElement.classList.add('resizing');
        this.setState({ narrowNav: false });
        clearTimeout(this.resizeTimer);
        this.resizeTimer = setTimeout(() => document.documentElement.classList.remove('resizing'), 350);
      };
      this.mq.addEventListener('change', this.onBreakpoint);
    } catch (e) {}
  }

  componentWillUnmount() {
    this.timers.forEach((t) => clearTimeout(t));
    if (this.mq) this.mq.removeEventListener('change', this.onBreakpoint);
    if (this.msgObserver) this.msgObserver.disconnect();
  }

  // Follow new content only while the reader is at the bottom. Opening a chat or
  // sending a message always jumps to the bottom; a reply that arrives while
  // someone is reading older messages does not pull them away.
  // The message box starts as one line next to its buttons. Once the text wraps
  // it takes the full width (buttons move below) and grows up to 8 lines.
  sizeComposer() {
    const ta = this.taEl;
    if (!ta) return;
    const line = 24, max = line * 8 + 20;
    if (!this.state.draft) {
      ta.style.height = '44px';
      ta.style.overflowY = 'hidden';
      if (this.state.composerTall) this.setState({ composerTall: false });
      return;
    }
    ta.style.height = 'auto';
    const h = ta.scrollHeight;
    ta.style.height = Math.min(Math.max(h, 44), max) + 'px';
    ta.style.overflowY = h > max ? 'auto' : 'hidden';
    const tall = this.state.draft.includes('\n') || h > 44 + 4;
    if (tall && !this.state.composerTall) this.setState({ composerTall: true });
  }

  componentDidUpdate() {
    this.sizeComposer();
    const el = this.msgEl;
    if (!el) return;
    const conv = this.state.convs.find((c) => c.id === this.state.activeId);
    const messages = conv ? conv.messages : [];
    const last = messages[messages.length - 1];
    const opened = this.state.view + ':' + this.state.activeId;
    if (opened !== this.opened) {
      this.opened = opened;
      this.atBottom = true;
    } else if (messages.length !== this.messageCount && last && last.role === 'user') {
      this.atBottom = true;
    }
    this.messageCount = messages.length;
    if (this.atBottom) el.scrollTop = el.scrollHeight;
  }

  onMsgScroll() {
    const el = this.msgEl;
    if (el) this.atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  }

  later(fn, ms) {
    const t = setTimeout(() => {
      this.timers = this.timers.filter((x) => x !== t);
      fn();
    }, ms);
    this.timers.push(t);
    return t;
  }

  isNarrow() {
    try { return window.matchMedia('(max-width: 830px)').matches; } catch (e) { return false; }
  }

  focusComposer() {
    setTimeout(() => { if (this.taEl) this.taEl.focus(); }, 0);
  }

  showToast(text) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: text });
    this.toastTimer = this.later(() => this.setState({ toast: '' }), Math.min(8000, Math.max(2200, text.length * 55)));
  }

  patchMessage(convId, msgId, fn) {
    this.setState((s) => ({
      convs: s.convs.map((c) => c.id !== convId ? c : { ...c, messages: c.messages.map((m) => m.id === msgId ? fn(m) : m) })
    }));
  }

  addAssistant(convId, text) {
    const id = this.nextId++;
    this.setState((s) => ({
      convs: s.convs.map((c) => c.id === convId ? { ...c, messages: [...c.messages, { id, role: 'assistant', text }] } : c)
    }));
    return id;
  }

  // Why a file can't be added, or '' if it can.
  fileProblem(file, pending) {
    if (/\.(docx?|xlsx?|pptx?)$/i.test(file.name)) return "Word, Excel and PowerPoint files aren't supported yet. Try a PDF or plain text.";
    const kind = classify(file);
    if (!kind) return file.name + " isn't supported. Attach images, PDFs or plain text files.";
    if (file.size === 0) return file.name + ' is empty.';
    if (pending.length >= MAX_FILES) return 'You can attach up to ' + MAX_FILES + ' files per message.';
    if (kind === 'text' && file.size > MAX_TEXT) return file.name + ' is too large. Text files can be up to 200 KB.';
    if (pending.reduce((sum, a) => sum + a.bytes, 0) + file.size > MAX_TOTAL) return 'Attachments can be up to 3 MB in total.';
    return '';
  }

  async addFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    this.setState({ reading: true });
    const pending = this.state.pending.slice();
    try {
      for (const file of files) {
        const problem = this.fileProblem(file, pending);
        if (problem) { this.showToast(problem); continue; }
        const kind = classify(file);
        pending.push({
          id: this.nextId++, name: file.name || 'file', kind, bytes: file.size,
          mediaType: kind === 'image' ? file.type : kind === 'pdf' ? 'application/pdf' : 'text/plain',
          data: await readBase64(file), thumb: kind === 'image' ? await makeThumb(file) : ''
        });
      }
    } catch (e) {
      this.showToast("Couldn't read that file. Please try again.");
    }
    this.setState({ pending, reading: false });
    this.focusComposer();
  }

  // Streams a real reply from /api/chat into the conversation.
  async ask(convId) {
    const conv = this.state.convs.find((c) => c.id === convId);
    if (!conv) return;
    // Error notices are shown to the user but never sent back to the model.
    const live = conv.messages.filter((m) => !m.error && (m.text || (m.attachments || []).length));
    const messages = live.map((m, i) => ({
      role: m.role, content: m.text || '', model: m.model, traceId: m.traceId,
      attachments: (m.attachments || []).map((a) => (i === live.length - 1 && a.data ? { name: a.name, type: a.mediaType, data: a.data } : { kind: a.kind }))
    }));
    const controller = new AbortController();
    this.abort = controller;
    this.setState({ typing: true, typingConv: convId, replyStarted: false, activity: [], verbTick: 0 });
    // Rotates the "Thinking...", "Pondering..." label until the reply starts.
    clearInterval(this.verbTimer);
    this.verbTimer = setInterval(() => this.setState((s) => ({ verbTick: s.verbTick + 1 })), 1800);
    let msgId = null;
    let traceId = null;
    const finish = () => {
      if (this.abort === controller) this.abort = null;
      clearInterval(this.verbTimer);
      this.setState({ typing: false, typingConv: null, replyStarted: false, activity: [] });
    };
    const fail = (text) => {
      if (msgId) this.patchMessage(convId, msgId, (m) => ({ ...m, text: m.text ? m.text + '\n\n' + text : text, error: true }));
      else { const id = this.addAssistant(convId, text); this.patchMessage(convId, id, (m) => ({ ...m, error: true })); }
    };
    try {
      const payload = JSON.stringify({ model: this.state.model, messages, conversationId: convId, temporary: !!conv.temporary });
      // The host rejects request bodies over 4.5 MB, so say so before sending.
      if (payload.length > 4400000) {
        fail('That message is too large to send. Try fewer or smaller attachments.');
        return finish();
      }
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: await authHeaders(),
        body: payload,
        signal: controller.signal
      });
      if (!res.ok || !res.body) {
        let error = res.status === 404 ? "Proxi's AI isn't connected on this site yet."
          : res.status === 413 ? 'That message is too large to send. Try fewer or smaller attachments.'
          : 'Something went wrong. Please try again.';
        try { const data = await res.json(); if (data.error) error = data.error + (data.code ? ' (error ' + res.status + ' · ' + data.code + ')' : ''); } catch (e) {}
        fail(error);
        return finish();
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line) continue;
          const event = JSON.parse(line);
          if (event.type === 'start') {
            traceId = event.traceId;
            // What Proxi did before sending goes in the reply's timeline, not a toast.
            const entries = redactionSteps(event.redactions).concat((event.notices || []).map((n) => ({ done: 'Checked attachments', detail: n, icon: 'file' })));
            if (entries.length) this.setState((s) => ({ activity: [...s.activity, ...entries] }));
          } else if (event.type === 'activity') {
            // A tool call. Before the reply starts it's shown live; after, it's added to the reply's steps.
            if (msgId) this.patchMessage(convId, msgId, (m) => ({ ...m, steps: [...(m.steps || []), toStep(event)] }));
            else this.setState((s) => ({ activity: [...s.activity, event] }));
          } else if (event.type === 'text') {
            if (!msgId) {
              msgId = this.addAssistant(convId, '');
              const steps = this.state.activity.map(toStep);
              this.patchMessage(convId, msgId, (m) => ({ ...m, traceId, steps }));
              clearInterval(this.verbTimer);
              this.setState({ replyStarted: true, activity: [] });
            }
            this.patchMessage(convId, msgId, (m) => ({ ...m, text: m.text + event.text }));
          } else if (event.type === 'done') {
            if (msgId) this.patchMessage(convId, msgId, (m) => ({ ...m, model: event.model }));
          } else if (event.type === 'title') {
            this.setState((s) => ({ convs: s.convs.map((c) => c.id === convId ? { ...c, title: event.title } : c) }));
          } else if (event.type === 'error') {
            fail(event.error);
          }
        }
      }
    } catch (e) {
      if (!controller.signal.aborted) fail("Couldn't reach Proxi. Check your connection and try again.");
    }
    finish();
  }

  // The signed-in user's saved chats, newest first. Messages load when a chat is opened.
  async loadConversations() {
    this.setState({ history: 'loading' });
    try {
      const res = await fetch('/api/conversations', { headers: await authHeaders() });
      if (res.status === 503) return this.setState({ history: 'off' });
      if (!res.ok) {
        let detail = {};
        try { detail = await res.json(); } catch (e) {}
        // A short, safe reference (status and database error code) to help find the cause.
        return this.setState({ history: 'error', historyRef: [res.status, detail.code || detail.kind].filter(Boolean).join(' · ') });
      }
      const { conversations } = await res.json();
      const today = new Date().toDateString();
      this.setState((s) => {
        const known = new Set(s.convs.map((c) => c.id));
        const saved = conversations.filter((c) => !known.has(c.id)).map((c) => ({
          id: c.id, title: c.title, group: new Date(c.updatedAt).toDateString() === today ? 'Today' : 'Earlier', messages: [], loaded: false
        }));
        return { convs: [...s.convs, ...saved], history: 'ok' };
      });
    } catch (e) {
      console.error('Loading chats failed:', e);
      this.setState({ history: 'error', historyRef: 'network' });
    }
  }

  async openConversation(id) {
    this.go({ view: 'chat', activeId: id });
    const conv = this.state.convs.find((c) => c.id === id);
    if (!conv || conv.loaded || conv.loading) return;
    const patch = (fields) => this.setState((s) => ({ convs: s.convs.map((c) => c.id === id ? { ...c, ...fields } : c) }));
    patch({ loading: true });
    try {
      const res = await fetch('/api/conversations?id=' + encodeURIComponent(id), { headers: await authHeaders() });
      if (!res.ok) throw new Error(res.status);
      const { messages } = await res.json();
      patch({ loading: false, loaded: true, messages: messages.map((m) => ({ id: this.nextId++, role: m.role, text: m.content, model: m.model, traceId: m.traceId, attachments: (m.attachments || []).map((a) => ({ kind: a.kind })) })) });
    } catch (e) {
      patch({ loading: false });
      this.showToast("Couldn't open this chat. Try again.");
    }
  }

  send(raw) {
    const text = (raw != null ? raw : this.state.draft).trim();
    const files = this.state.pending;
    if ((!text && !files.length) || this.state.typing || this.state.reading) return;
    const id = this.nextId++;
    let convId = this.state.view === 'chat' ? this.state.activeId : null;
    const current = this.state.convs.find((c) => c.id === convId);
    // Never send from a half-loaded chat: saving it would drop its earlier messages.
    if (current && !current.loaded) return;
    let fresh = null;
    if (!convId) {
      convId = crypto.randomUUID();
      const title = maskCards(text);
      fresh = { id: convId, title: title ? (title.length > 40 ? title.slice(0, 40).trim() + '...' : title) : 'Attachment', group: 'Today', messages: [], loaded: true, temporary: this.state.temporary };
    }
    this.setState((s) => {
      // The active chat moves to the top of Today.
      const base = fresh ? [fresh, ...s.convs] : [{ ...current, group: 'Today' }, ...s.convs.filter((c) => c.id !== convId)];
      return {
        draft: '',
        pending: [],
        view: 'chat',
        activeId: convId,
        modelMenu: false,
        convs: base.map((c) => c.id === convId ? { ...c, messages: [...c.messages, { id, role: 'user', text, attachments: files }] } : c)
      };
    });
    this.ask(convId);
  }

  stop() {
    if (this.abort) { this.abort.abort(); this.abort = null; }
    this.setState({ typing: false, typingConv: null, replyStarted: false });
  }

  truncateAt(msgId) {
    this.setState((s) => ({
      convs: s.convs.map((c) => {
        if (c.id !== s.activeId) return c;
        const i = c.messages.findIndex((m) => m.id === msgId);
        return i < 0 ? c : { ...c, messages: c.messages.slice(0, i) };
      })
    }));
  }

  edit(msg) {
    this.stop();
    this.truncateAt(msg.id);
    this.setState({ draft: msg.text, pending: (msg.attachments || []).filter((a) => a.data) });
    this.focusComposer();
  }

  regen(msg) {
    if (this.state.typing) return;
    this.truncateAt(msg.id);
    this.ask(this.state.activeId);
  }

  copy(key, text) {
    try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {}); } catch (e) {}
    this.setState({ copied: key });
    this.later(() => this.setState((s) => (s.copied === key ? { copied: null } : null)), 1500);
  }

  vote(m, dir) {
    const next = this.state.votes[m.id] === dir ? null : dir;
    this.setState((s) => ({ votes: { ...s.votes, [m.id]: next } }));
    if (m.traceId) {
      authHeaders().then((headers) => fetch('/api/feedback', {
        method: 'POST',
        headers,
        body: JSON.stringify({ traceId: m.traceId, value: next === 'up' ? 1 : next === 'down' ? 0 : null })
      })).catch(() => {});
    }
  }

  // ---- Settings: custom instructions and "Delete chats after" (7, 30 or 90 days) ----
  async loadSettings() {
    try {
      const res = await fetch('/api/settings', { headers: await authHeaders() });
      if (!res.ok) throw new Error('settings ' + res.status);
      const data = await res.json();
      this.setState({
        settings: { chatRetentionDays: data.chatRetentionDays, options: data.retentionOptions, customInstructions: data.customInstructions || '', instructionsMax: data.customInstructionsMax || 1500 },
        instructionsDraft: data.customInstructions || ''
      });
    } catch {
      this.showToast("Couldn't load your settings. Please try again.");
    }
  }

  async saveRetention(days) {
    const before = this.state.settings;
    if (!before || before.chatRetentionDays === days) return;
    this.setState({ settings: { ...before, chatRetentionDays: days }, settingsBusy: true });
    try {
      const res = await fetch('/api/settings', { method: 'PUT', headers: await authHeaders(), body: JSON.stringify({ chatRetentionDays: days }) });
      if (!res.ok) throw new Error('settings ' + res.status);
      this.showToast(`Chats will be deleted after ${days} days without activity.`);
    } catch {
      this.setState({ settings: before });
      this.showToast("Couldn't save your settings. Please try again.");
    }
    this.setState({ settingsBusy: false });
  }

  async saveInstructions() {
    const before = this.state.settings;
    const text = this.state.instructionsDraft.trim();
    if (!before || text === before.customInstructions) return;
    this.setState({ settingsBusy: true });
    try {
      const res = await fetch('/api/settings', { method: 'PUT', headers: await authHeaders(), body: JSON.stringify({ customInstructions: text }) });
      if (!res.ok) throw new Error('settings ' + res.status);
      this.setState({ settings: { ...before, customInstructions: text }, instructionsDraft: text });
      this.showToast('Instructions saved');
    } catch {
      this.showToast("Couldn't save your instructions. Please try again.");
    }
    this.setState({ settingsBusy: false });
  }

  go(patch) {
    this.setState({ chatMenu: false, modelMenu: false, userMenu: false, narrowNav: false, ...patch });
  }

  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#6D28FF';
    const conv = s.convs.find((c) => c.id === s.activeId);
    const isChat = s.view === 'chat' && !!conv;
    const isNew = s.view === 'new' || (s.view === 'chat' && !conv);
    const pages = {
      skills: { title: 'Skills', desc: 'Reusable instructions Proxi can apply when a task calls for them.', empty: 'No skills yet', hint: 'Create a skill for a task you repeat, like a weekly report format or a code review checklist.', action: 'Create a skill' },
    };
    const page = pages[s.view] || pages.skills;
    const isPage = !!pages[s.view];

    const q = s.query.trim().toLowerCase();
    const item = (c) => {
      const on = isChat && c.id === s.activeId;
      return {
        title: c.title,
        cls: on ? '' : 'hov',
        current: on ? 'page' : 'false',
        bg: on ? 'var(--accent-soft)' : 'transparent',
        shadow: 'none',
        color: on ? 'var(--text)' : 'var(--text-2)',
        weight: on ? '500' : '400',
        open: () => this.openConversation(c.id)
      };
    };
    // Temporary chats are never listed: they exist only until the page reloads.
    const list = s.convs.filter((c) => !c.temporary && (!q || c.title.toLowerCase().includes(q)));
    const today = list.filter((c) => c.group === 'Today').map(item);
    const older = list.filter((c) => c.group !== 'Today').map(item);

    const nav = {};
    ['new', 'skills'].forEach((k) => {
      const on = k === 'new' ? isNew : s.view === k;
      nav[k + 'Cls'] = on ? '' : 'hov';
      nav[k + 'Cur'] = on ? 'page' : 'false';
      nav[k + 'Bg'] = on ? 'var(--accent-soft)' : 'transparent';
      nav[k + 'Shadow'] = 'none';
    });

    const msgs = isChat ? conv.messages.map((m) => {
      const v = s.votes[m.id];
      const key = 'm' + m.id;
      const copied = s.copied === key;
      const shown = m.role === 'user' ? maskCards(m.text || '') : m.text || '';
      return {
        text: shown,
        attachments: (m.attachments || []).map((a, i) => ({
          key: i, thumb: a.data ? a.thumb : '', muted: !a.data,
          label: a.data ? a.name : KIND_LABELS[a.kind] + ' removed'
        })),
        isUser: m.role === 'user',
        isAssistant: m.role === 'assistant',
        hasSteps: !!(m.steps && m.steps.length),
        steps: [...new Set((m.steps || []).map((st) => st.short))].join(' · '),
        stepList: [...(m.steps || []), ...(m.model ? [{ text: 'Answered with ' + modelLabel(m.model), icon: 'spark' }] : [])].map((st, i) => ({ key: i, text: st.text, icon: stepIcon(st.icon) })),
        canVote: !conv.temporary,
        html: m.role === 'assistant' ? renderCitations(renderMarkdown(m.text || '')) : '',
        copied,
        notCopied: !copied,
        copyLabel: copied ? 'Copied' : (m.role === 'user' ? 'Copy message' : 'Copy response'),
        upPressed: v === 'up' ? 'true' : 'false',
        downPressed: v === 'down' ? 'true' : 'false',
        upColor: v === 'up' ? accent : 'var(--text-muted-3)',
        downColor: v === 'down' ? accent : 'var(--text-muted-3)',
        upFill: v === 'up' ? 'currentColor' : 'none',
        downFill: v === 'down' ? 'currentColor' : 'none',
        onCopy: () => this.copy(key, shown),
        onEdit: () => this.edit(m),
        onUp: () => this.vote(m, 'up'),
        onDown: () => this.vote(m, 'down'),
        onRegen: () => this.regen(m)
      };
    }) : [];

    const models = [
      { name: 'Opus 5.5', note: 'Most capable, for complex work' },
      { name: 'Sonnet 5.5', note: 'Fast and smart for everyday tasks' },
      { name: 'Haiku 5.5', note: 'Fastest, for quick answers' }
    ].map((o) => ({ ...o, on: o.name === s.model, checked: o.name === s.model ? 'true' : 'false', pick: () => this.setState({ model: o.name, modelMenu: false }) }));

    // Starters: they fill the message box (and open the file picker for a PDF) instead of sending.
    const chips = [
      { label: 'Summarize a PDF', draft: 'Summarize the key points of the attached PDF.', files: true },
      { label: 'Draft an email', draft: 'Draft a short, friendly email to ' },
      { label: 'Explain a concept', draft: 'Explain in plain terms: ' }
    ].map((c) => ({ ...c, pick: () => {
      this.setState({ draft: c.draft });
      if (c.files && this.fileEl) this.fileEl.click(); else this.focusComposer();
    } }));

    const canSend = (!!s.draft.trim() || s.pending.length > 0) && !s.reading;
    const tall = s.composerTall || s.pending.length > 0;
    const liveStep = [...s.activity].reverse().find((a) => a.label);
    const showNav = true;

    return {
      accent,
      anyMenu: s.modelMenu || s.chatMenu || s.userMenu,
      closeMenus: () => this.setState({ modelMenu: false, chatMenu: false, userMenu: false }),
      showNav,
      navClass: s.narrowNav ? 'side open' : (s.collapsed ? 'side collapsed' : 'side'),
      narrowNav: s.narrowNav,
      menuBtnDisplay: s.collapsed ? 'flex' : 'none',
      collapse: () => (this.isNarrow() ? this.setState({ narrowNav: false }) : this.setState({ collapsed: true })),
      openNav: () => (this.isNarrow() ? this.setState({ narrowNav: true, collapsed: false }) : this.setState({ collapsed: false })),
      nav,
      newChat: () => { this.go({ view: 'new', activeId: null, draft: '' }); this.focusComposer(); },
      openSkills: () => this.showToast('Skills is not part of this prototype'),
      openSettings: () => { this.go({ view: 'settings' }); this.loadSettings(); },
      isSettings: s.view === 'settings',
      settingsBusy: !s.settings || s.settingsBusy,
      retentionValue: String(s.settings?.chatRetentionDays ?? 30),
      retentionChoices: (s.settings?.options || [7, 30, 90]).map((d) => ({ value: String(d), label: d + ' days' })),
      changeRetention: (e) => this.saveRetention(Number(e.target.value)),
      instructionsMax: s.settings?.instructionsMax || 1500,
      instructionsDraft: s.instructionsDraft,
      instructionsCount: `${s.instructionsDraft.length.toLocaleString('en-US')} / ${(s.settings?.instructionsMax || 1500).toLocaleString('en-US')}`,
      onInstructions: (e) => this.setState({ instructionsDraft: e.target.value }),
      noSaveInstructions: !s.settings || s.settingsBusy || s.instructionsDraft.trim() === s.settings.customInstructions,
      saveInstructionsBg: !s.settings || s.settingsBusy || s.instructionsDraft.trim() === s.settings.customInstructions ? 'var(--disabled)' : 'var(--inverse)',
      saveInstructionsColor: !s.settings || s.settingsBusy || s.instructionsDraft.trim() === s.settings.customInstructions ? 'var(--text-disabled)' : 'var(--on-inverse)',
      saveInstructions: () => this.saveInstructions(),
      themeValue: s.theme,
      themeChoices: [{ value: 'system', label: 'System' }, { value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }],
      changeTheme: (e) => { window.proxiTheme?.set(e.target.value); this.setState({ theme: e.target.value }); },
      searchOpen: s.searchOpen,
      searchExpanded: s.searchOpen ? 'true' : 'false',
      toggleSearch: () => {
        if (s.searchOpen) { this.setState({ searchOpen: false, query: '' }); return; }
        this.setState({ searchOpen: true });
        setTimeout(() => { if (this.searchEl) this.searchEl.focus(); }, 0);
      },
      closeSearch: () => this.setState({ searchOpen: false, query: '' }),
      searchRef: (el) => { this.searchEl = el; },
      query: s.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      today, older,
      hasToday: today.length > 0,
      hasOlder: older.length > 0,
      noResults: !!q && list.length === 0,
      historyNote: q ? '' : s.history === 'loading' && !list.length ? 'Loading your chats...'
        : s.history === 'off' ? "Chat history isn't set up yet, so chats aren't saved."
        : s.history === 'error' ? "Couldn't load your previous chats" + (s.historyRef ? ' (error ' + s.historyRef + ').' : '.') : '',
      historyRetry: s.history === 'error' ? () => this.loadConversations() : null,

      isChat, isNew, isPage, page,
      pageAction: () => this.showToast(page.action + ' is not part of this prototype'),
      headerBorder: isNew ? 'var(--surface)' : 'var(--divider)',
      chatTitle: conv ? (conv.temporary ? 'Temporary chat' : conv.title) : '',
      temporary: s.temporary,
      temporaryPressed: s.temporary ? 'true' : 'false',
      notTemporary: !s.temporary,
      temporaryBg: s.temporary ? accent : 'var(--surface)',
      temporaryBorder: s.temporary ? accent : 'var(--border)',
      temporaryColor: s.temporary ? '#FFFFFF' : 'var(--text-muted)',
      temporaryHint: "Temporary chats aren't saved or shown in your history",
      composerBorder: (isNew && s.temporary) || (isChat && conv.temporary) ? 'var(--temp-border)' : 'var(--border-strong)',
      composerBorderStyle: (isNew && s.temporary) || (isChat && conv.temporary) ? 'dashed' : 'solid',
      toggleTemporary: () => this.setState({ temporary: !s.temporary }),
      chatMenu: s.chatMenu,
      chatMenuExpanded: s.chatMenu ? 'true' : 'false',
      toggleChatMenu: () => this.setState({ chatMenu: !s.chatMenu, modelMenu: false, userMenu: false }),
      deleteChat: async () => {
        const id = s.activeId;
        this.stop();
        this.setState((st) => ({ convs: st.convs.filter((c) => c.id !== id), activeId: null, view: 'new', chatMenu: false }));
        try {
          const res = await fetch('/api/conversations?id=' + encodeURIComponent(id), { method: 'DELETE', headers: await authHeaders() });
          this.showToast(res.ok || res.status === 503 ? 'Chat deleted' : "Couldn't delete the chat");
        } catch (e) {
          this.showToast("Couldn't delete the chat");
        }
      },
      share: () => this.showToast('Link copied to clipboard'),

      msgRef: (el) => {
        if (el === this.msgEl) return;
        this.msgEl = el;
        // When the list's height changes (keyboard, attachments, rotation), stay at the bottom if we were there.
        if (this.msgObserver) this.msgObserver.disconnect();
        if (el && window.ResizeObserver) {
          this.msgObserver = new ResizeObserver(() => { if (this.atBottom) el.scrollTop = el.scrollHeight; });
          this.msgObserver.observe(el);
        }
      },
      onMsgScroll: () => this.onMsgScroll(),
      msgs,
      workingLabel: conv && conv.loading ? 'Loading' : liveStep ? liveStep.label : WORKING_VERBS[s.verbTick % WORKING_VERBS.length],
      showTyping: isChat && ((s.typing && !s.replyStarted && s.typingConv === s.activeId) || !!conv.loading),

      showComposer: isChat || isNew,
      composerPad: '8px 24px 20px',
      composerMax: isNew ? '720px' : '760px',
      composerRadius: tall ? '22px' : '28px',
      composerPadding: tall ? '10px 8px 6px 8px' : '6px 6px 6px 6px',
      attachOrder: tall ? 2 : 1,
      textOrder: tall ? 1 : 2,
      textFlex: tall ? '1 0 100%' : '1 1 0',
      textPadding: tall ? '6px 10px 4px' : '10px 6px',
      modelName: s.model.split(' ')[0],
      modelVersion: s.model.split(' ').slice(1).join(' '),
      showChips: isNew && !s.draft.trim() && !s.pending.length,
      taRef: (el) => { this.taEl = el; },
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !(e.nativeEvent && e.nativeEvent.isComposing)) { e.preventDefault(); this.send(); }
      },
      onSubmit: (e) => { e.preventDefault(); this.send(); },
      accept: ACCEPT,
      fileRef: (el) => { this.fileEl = el; },
      attach: () => { if (this.fileEl) this.fileEl.click(); },
      onFiles: (e) => { const files = Array.from(e.target.files); e.target.value = ''; this.addFiles(files); },
      pending: s.pending.map((a) => ({ id: a.id, name: a.name, thumb: a.thumb, size: formatSize(a.bytes), remove: () => this.setState((st) => ({ pending: st.pending.filter((x) => x.id !== a.id) })) })),
      imageHint: s.pending.some((a) => a.kind === 'image'),
      dragging: s.dragging,
      onPaste: (e) => {
        const files = e.clipboardData && e.clipboardData.files;
        if (files && files.length) { e.preventDefault(); this.addFiles(files); }
      },
      onDragOver: (e) => {
        if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
        e.preventDefault();
        if (!s.dragging && (isChat || isNew)) this.setState({ dragging: true });
      },
      onDragLeave: (e) => {
        if (s.dragging && !e.currentTarget.contains(e.relatedTarget)) this.setState({ dragging: false });
      },
      onDrop: (e) => {
        if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
        e.preventDefault();
        this.setState({ dragging: false });
        if (isChat || isNew) this.addFiles(e.dataTransfer.files);
      },
      model: s.model,
      models,
      modelMenu: s.modelMenu,
      modelMenuExpanded: s.modelMenu ? 'true' : 'false',
      toggleModelMenu: () => this.setState({ modelMenu: !s.modelMenu, chatMenu: false, userMenu: false }),
      typing: s.typing,
      notTyping: !s.typing,
      stop: () => this.stop(),
      noSend: !canSend,
      sendBg: canSend ? 'var(--inverse)' : 'var(--disabled)',
      sendColor: canSend ? 'var(--on-inverse)' : 'var(--text-disabled)',
      sendCursor: canSend ? 'pointer' : 'default',
      chips,

      userName: this.props.userName,
      userImage: this.props.userImage,
      userInitial: (this.props.userName || '?').trim().charAt(0).toUpperCase(),
      userMenu: s.userMenu,
      userMenuExpanded: s.userMenu ? 'true' : 'false',
      toggleUserMenu: () => this.setState({ userMenu: !s.userMenu, chatMenu: false, modelMenu: false }),
      docsHome: DOCS_URL,
      docsPrivacy: DOCS_URL + '/privacy',
      privacyPolicy: DOCS_URL + '/privacy-policy',
      terms: DOCS_URL + '/terms',
      docsSecurity: DOCS_URL + '/security',
      closeUserMenu: () => this.setState({ userMenu: false }),
      logout: async () => {
        this.setState({ userMenu: false });
        try {
          await window.Clerk.signOut({ redirectUrl: location.origin + '/' });
        } catch (e) {
          this.showToast("Couldn't log out. Please try again.");
        }
      },

      hasToast: !!s.toast,
      toast: s.toast
    };
  }
}

const propDefs = {"accent":{"editor":"color","default":"#6D28FF","options":["#6D28FF","#0F7B5F","#F4511E","#111111"]},"startView":{"editor":"enum","options":["chat","new"],"default":"chat"},"$preview":{"width":1440,"height":900}};
const props = {};
for (const [k, d] of Object.entries(propDefs)) if (!k.startsWith('$')) props[k] = d.default;

// Clerk's test mode keeps its browser token in two cookies: one per Clerk app and a
// shared copy, and falls back to the shared copy when the app's own is missing. After
// switching Clerk apps, that shared copy belongs to the old app and every sign-in fails
// with "authorization_invalid". Dropping it leaves the per-app cookie in charge; if that
// is missing too, Clerk creates a fresh token.
function clearSharedClerkToken() {
  for (const extra of ['', '; Secure; SameSite=None', '; Secure; SameSite=None; Partitioned']) {
    document.cookie = '__clerk_db_jwt=; Max-Age=0; Path=/' + extra;
  }
}

async function start() {
  const clerk = window.Clerk;
  clearSharedClerkToken();
  await clerk.load({
    ui: { ClerkUI: window.__internal_ClerkUICtor },
    appearance: { variables: { colorPrimary: '#6D28FF', fontFamily: 'Inter, system-ui, sans-serif', borderRadius: '10px' } }
  });
  // Signing in swaps the sign-in screen for the chat. Signing out is handled by
  // logout(), which must let Clerk finish ending the session before reloading.
  const signedIn = !!clerk.user;
  clerk.addListener(({ user }) => { if (user && !signedIn) location.reload(); });
  if (!signedIn) {
    // Sign-in happens on Clerk's hosted page (it handles sign-up, Google and GitHub, and
    // Clerk's fraud checks under its own security policy), then returns here signed in.
    const back = location.origin + '/';
    const goToSignIn = () => clerk.redirectToSignIn({ signInForceRedirectUrl: back, signUpForceRedirectUrl: back });
    let redirected = true;
    try { redirected = sessionStorage.getItem('proxi-sign-in') === '1'; sessionStorage.setItem('proxi-sign-in', '1'); } catch {}
    if (!redirected) return goToSignIn();
    // Already sent there once in this tab and still signed out: show the button instead of looping.
    document.getElementById('auth').hidden = false;
    document.getElementById('sign-in').addEventListener('click', goToSignIn);
    return;
  }
  try { sessionStorage.removeItem('proxi-sign-in'); } catch {}
  document.documentElement.classList.add('app-mode');
  trackViewport();
  props.userName = clerk.user.fullName || clerk.user.primaryEmailAddress?.emailAddress || 'Signed in';
  props.userImage = clerk.user.hasImage ? clerk.user.imageUrl : '';
  createApp({
    template: '#tpl',
    setup() {
      const tick = ref(0);
      const comp = new Component(props);
      comp.tick = tick;
      const v = computed(() => (tick.value, comp.renderVals()));
      onMounted(() => comp.componentDidMount && comp.componentDidMount());
      onUpdated(() => comp.componentDidUpdate && comp.componentDidUpdate());
      onBeforeUnmount(() => comp.componentWillUnmount && comp.componentWillUnmount());
      return { v };
    }
  }).mount('#app');
}
start();
</script>
